# Chapter 1 — System Design Introduction

## 1.1 System Design (সিস্টেম ডিজাইন) কী?
System Design বা সিস্টেম ডিজাইন হলো একটি সফটওয়্যার সিস্টেমের সম্পূর্ণ কাঠামো (architecture) পরিকল্পনা করার প্রক্রিয়া, যেখানে নির্ধারণ করা হয়—সিস্টেমটি কীভাবে কাজ করবে, কীভাবে বিভিন্ন অংশ (components) একে অপরের সাথে যোগাযোগ করবে, কীভাবে এটি ভবিষ্যতে বৃদ্ধি পাবে (scalability), কীভাবে ডেটা নিরাপদ থাকবে (security), এবং কীভাবে বড় পরিমাণ ব্যবহারকারী ও ডেটা কার্যকরভাবে পরিচালনা করবে।
সহজ ও প্রাঞ্জল বাংলায় বলতে গেলে:
> "System Design হলো একটি সফটওয়্যার সিস্টেমের ভবিষ্যৎ রূপ কেমন হবে, সেটির পূর্ণাঙ্গ নকশা বা ব্লু-প্রিন্ট তৈরি করার প্রক্রিয়া, যাতে এটি বর্তমান ও ভবিষ্যতের চাহিদা অনুযায়ী দ্রুত, নির্ভরযোগ্য এবং সম্প্রসারণযোগ্য (scalable)ভাবে কাজ করতে পারে।"

ধরুন, আপনি একটি ছোট ই-কমার্স (E-commerce) বা ইআরপি (ERP) সফটওয়্যার তৈরি করলেন।
**প্রাথমিক অবস্থা:**
- মাত্র ১০ জন ইউজার।
- একটি সাধারণ সার্ভার।
- একটি মাত্র ডাটাবেজ (Database)।
- সীমিত ফিচার

এই অবস্থায় সিস্টেমটি খুবই দ্রুত এবং স্থিতিশীলভাবে (stable) কাজ করছিল।

**২ বছর পর বর্তমান অবস্থা:**
- ইউজারের সংখ্যা ৫০,০০০ ছাড়িয়ে গেছে।
- প্রতিদিন হাজার হাজার ট্রানজ্যাকশন (Transaction) হচ্ছে।
- একটি নতুন মোবাইল অ্যাপ যুক্ত হয়েছে।
- একাধিক পেমেন্ট গেটওয়ের (Payment API) ইন্টিগ্রেশন হয়েছে।
- রিয়েল-টাইম (Real-time) রিপোর্টিংয়ের দরকার পড়ছে।

এই পর্যায়ে এসে পূর্বের সরল আর্কিটেকচার আর কার্যকর থাকে না। সিস্টেম ধীরে ধীরে স্লো হয়ে যায়, ডাটাবেজে লকিং সমস্যা দেখা দেয়, সার্ভার অতিরিক্ত লোড নিতে পারে না, এমনকি কিছু ক্ষেত্রে সিস্টেম ক্র্যাশও করতে পারে। ঠিক এই জায়গা থেকেই **System Design**-এর প্রকৃত প্রয়োজনীয়তা স্পষ্ট হয়ে ওঠে। কারণ একটি ভালো System Design আগেই এসব স্কেলিং, পারফরম্যান্স, এবং নির্ভরযোগ্যতার (reliability) সমস্যা সমাধানের জন্য কাঠামো তৈরি করে রাখে, যাতে ভবিষ্যতে সিস্টেম বড় হলেও তা নির্বিঘ্নে (smoothly) পরিচালিত হতে পারে।

---

## 1.2 কেন System Design গুরুত্বপূর্ণ?

System Design হলো একটি সফটওয়্যার সিস্টেমের **আর্কিটেকচার, কম্পোনেন্ট, ডাটা ফ্লো, স্কেলিং, সিকিউরিটি এবং ইন্টিগ্রেশন** কীভাবে কাজ করবে তার পরিকল্পনা। একটি ভালো System Design ছাড়া বড় সফটওয়্যার প্রজেক্ট দীর্ঘমেয়াদে টিকিয়ে রাখা কঠিন হয়ে যায়।

## ১. Scalability (স্কেল করার সক্ষমতা)

শুরুর দিকে ১,০০০ ইউজার থাকলেও ভবিষ্যতে ১০ লাখ ইউজার হতে পারে। ভালো System Design সিস্টেমকে বেশি ট্রাফিক এবং ডাটা হ্যান্ডেল করতে সাহায্য করে।

উদাহরণ:

* ছোট অ্যাপ: Single Server
* বড় অ্যাপ: Load Balancer + Multiple Servers + Caching + Database Sharding

---

## ২. Performance (উচ্চ পারফরম্যান্স)

ভালো ডিজাইন সিস্টেমকে দ্রুত রেসপন্স করতে সাহায্য করে।

উদাহরণ:

* Database Indexing
* Caching
* Asynchronous Processing
* CDN ব্যবহার

যদি ডিজাইন ভালো না হয়, তাহলে:

* API Slow হবে
* Database Bottleneck হবে
* User Experience খারাপ হবে

---

## ৩. Reliability (নির্ভরযোগ্যতা)

সিস্টেমের কোনো অংশ Fail করলেও পুরো সিস্টেম বন্ধ হয়ে যাবে না।

উদাহরণ:

* Redundant Servers
* Database Replication
* Failover Mechanism
* Message Queue

যেমন:
Netflix এবং Amazon তাদের সিস্টেমকে এমনভাবে ডিজাইন করে যাতে একটি সার্ভার নষ্ট হলেও সার্ভিস চালু থাকে।

---

## ৪. Maintainability (সহজে পরিবর্তন ও রক্ষণাবেক্ষণ)

একটি ERP বা Microservices Project-এ প্রতিনিয়ত নতুন Feature যোগ হয়।

ভালো System Design থাকলে:

* নতুন Feature যোগ করা সহজ হয়।
* Bug Fix দ্রুত করা যায়।
* Code Reuse করা যায়।
* নতুন Developer দ্রুত Onboard হতে পারে।

---

## ৫. Security (নিরাপত্তা)

System Design-এর মাধ্যমেই নির্ধারণ করা হয়:

* Authentication
* Authorization
* Encryption
* Audit Logging
* API Security
* Rate Limiting

খারাপ ডিজাইনের কারণে:

* Data Leak
* Unauthorized Access
* System Breach

ঘটতে পারে।

---

## ৬. Cost Optimization (খরচ কমানো)

ভালো System Design Infrastructure Cost কমায়।

উদাহরণ:

* Caching ব্যবহার করলে Database Load কমে।
* Auto Scaling ব্যবহার করলে অপ্রয়োজনীয় Server Cost কমে।
* Queue ব্যবহার করলে Peak Load সামলানো সহজ হয়।

---

## ৭. High Availability (সর্বদা সচল থাকা)

ব্যাংকিং, ERP, টেলিকম, Microfinance-এর মতো সিস্টেমে Downtime খুব ব্যয়বহুল।

ভালো System Design নিশ্চিত করে:

* 99.9% বা তার বেশি Uptime
* Disaster Recovery
* Backup Strategy
* Geo Redundancy

---

## ৮. Business Growth Support

Business বড় হওয়ার সাথে সাথে System-ও বড় হয়।

উদাহরণ:
একটি Microfinance Software:

* ১০,০০০ Customer → ৭০ লাখ Customer
* ১ Branch → ২,০০০+ Branch
* কয়েক হাজার Transaction → কোটি কোটি Transaction

ভালো System Design না থাকলে পুরো সিস্টেম Rebuild করতে হতে পারে।

## 1.3 Real World Example (বাস্তব উদাহরণ)
একটি শিক্ষা প্রতিষ্ঠান প্রথমে একটি ছোট **Online Admission & Result Portal** তৈরি করেছিল। শুরুতে লক্ষ্য ছিল খুব সাধারণ: শিক্ষার্থীরা অনলাইনে ভর্তি ফর্ম পূরণ করবে, ফি পেমেন্ট করবে, আর পরে একই পোর্টাল থেকে রেজাল্ট দেখতে পারবে। প্রথম ভার্সনে সিস্টেমটি ভালোই কাজ করছিল, কারণ ব্যবহারকারী কম ছিল এবং একই সময়ে খুব বেশি ট্রাফিক আসতো না।

**Business Problem:**
- ভর্তি ফর্ম অনলাইনে জমা নিতে হবে।
- আবেদনকারীর ছবি, জন্মসনদ এবং মার্কশিট আপলোড করতে হবে।
- ভর্তি ফি অনলাইনে পেমেন্ট করতে হবে।
- পেমেন্ট সফল হলে রসিদ তৈরি করতে হবে।
- পরীক্ষার ফলাফল প্রকাশের দিনে শিক্ষার্থী ও অভিভাবকরা লগইন করে ফলাফল দেখবে।
- অ্যাডমিন প্যানেল থেকে আবেদন, পেমেন্ট, ফলাফল এবং রিপোর্ট ম্যানেজ করতে হবে।

**প্রাথমিক টেক স্ট্যাক (Initial Tech Stack):**
- Frontend: HTML, CSS, Bootstrap, jQuery
- Backend: ASP.NET Core MVC
- API Layer: একই ASP.NET Core অ্যাপ্লিকেশনের Controller
- Database: SQL Server Express
- ORM: Entity Framework Core
- Hosting: IIS on a single Windows Server
- File Storage: একই সার্ভারের `wwwroot/uploads` ফোল্ডার
- Authentication: Cookie-based login session
- Payment: Third-party payment gateway API
- Email/SMS: সরাসরি অ্যাপ্লিকেশন থেকে SMTP এবং SMS API call
- Reporting: SQL query থেকে synchronously PDF/Excel generate

**প্রাথমিক সিস্টেম স্ট্রাকচার:**
```text
User Browser
     ↓
IIS Web Server
     ↓
ASP.NET Core MVC Application
     ├── Admission Module
     ├── Payment Module
     ├── Result Module
     ├── Admin Module
     ├── File Upload Logic
     ├── Report Generation Logic
     └── Email/SMS Sending Logic
     ↓
Single SQL Server Database
     ↓
Local Server Disk: wwwroot/uploads
```

**শুরুতে বাস্তব লোড:**
- ১টি ক্যাম্পাস।
- প্রায় ৫০০ শিক্ষার্থী।
- দিনে ৫০-১০০টি ভর্তি ফর্ম সাবমিট।
- একই সময়ে সর্বোচ্চ ২০-৩০ জন ইউজার।
- ফাইল আপলোড খুব কম।
- রিপোর্ট সাধারণত অ্যাডমিনরা অফিস সময়ে চালাতেন।

এই অবস্থায় সিস্টেমটি দ্রুত মনে হচ্ছিল। কারণ Web Server, Database, File Storage এবং Reporting সব একই মেশিনে থাকলেও লোড খুব কম ছিল।

**২ বছর পরে সিস্টেমের অবস্থা:**
- ১২টি ক্যাম্পাস একই পোর্টাল ব্যবহার করতে শুরু করলো।
- ভর্তি মৌসুমে দিনে ৮,০০০-১০,০০০ আবেদন জমা পড়তে লাগলো।
- ফলাফল প্রকাশের প্রথম ৩০ মিনিটে ২০,০০০+ request আসতে লাগলো।
- একই সময়ে ৩,০০০-৫,০০০ concurrent user লগইন করার চেষ্টা করছিল।
- প্রতিটি আবেদনকারীর ছবি, ডকুমেন্ট, মার্কশিট এবং পেমেন্ট রসিদ জমা হচ্ছিল।
- অ্যাডমিনরা একই সময়ে admission report, payment report এবং result summary generate করছিলেন।

**বাস্তব ঘটনার মতো একটি Production Day Timeline:**
```text
09:00 AM  Result publish করার ঘোষণা দেওয়া হলো।
09:05 AM  শিক্ষার্থী ও অভিভাবকরা একসাথে login page refresh করতে শুরু করলো।
09:10 AM  Login API response time 300ms থেকে 8-12 seconds হয়ে গেল।
09:15 AM  SQL Server CPU 95%-100% এ চলে গেল।
09:20 AM  Payment callback queue না থাকায় gateway থেকে আসা callback request timeout হতে লাগলো।
09:25 AM  Admin panel থেকে report download করার চেষ্টা করলে application pool recycle হলো।
09:30 AM  কিছু user payment successful SMS পেল, কিন্তু portal-এ payment pending দেখাচ্ছিল।
09:45 AM  IIS restart দেওয়া হলো, কিন্তু restart-এর পরে pending SMS/email process হারিয়ে গেল।
10:15 AM  Team result page সাময়িকভাবে বন্ধ করে শুধু notice দেখাতে বাধ্য হলো।
```

**Database-এর বাস্তব চাপ:**
- `Students` table: শুরুতে ৫০০ row, পরে ১,৫০,০০০+ row।
- `Applications` table: ভর্তি মৌসুম শেষে ২,৫০,০০০+ row।
- `Payments` table: প্রতিদিন ২০,০০০+ transaction record।
- `UploadedFiles` table: ৮-১০ লক্ষ file metadata।
- `Results` table: প্রতি পরীক্ষায় কয়েক লক্ষ row insert/update।
- `AuditLogs` table: login, payment, admin action মিলিয়ে দ্রুত বড় হচ্ছিল।

**Slow Query-এর উদাহরণ:**
```sql
SELECT s.StudentId, s.Name, r.TotalMark, r.Grade, p.PaymentStatus
FROM Students s
JOIN Results r ON s.StudentId = r.StudentId
LEFT JOIN Payments p ON s.StudentId = p.StudentId
WHERE s.RollNo = @RollNo AND r.ExamId = @ExamId;
```

এই query দেখতে ছোট, কিন্তু `RollNo`, `ExamId`, `StudentId`-এ proper index না থাকলে result publish day-তে একই query হাজার হাজার বার চলতে থাকে। ফলে database CPU, memory এবং disk I/O একসাথে চাপের মধ্যে পড়ে।

**Payment Failure Scenario:**
```text
1. User payment gateway-তে টাকা দিল।
2. Gateway payment success দেখাল।
3. Gateway portal-এর callback URL hit করলো।
4. Portal তখন slow ছিল, তাই callback request timeout হলো।
5. Gateway পরে আবার callback retry করলো।
6. Portal duplicate callback properly handle করতে পারলো না।
7. User-এর টাকা কাটা গেল, কিন্তু portal-এ status pending থাকলো।
```

এখানে সমস্যাটি শুধু coding bug নয়। এটি design problem। Payment callback অবশ্যই idempotent হতে হবে, transaction reference unique হতে হবে, আর receipt generation background worker দিয়ে reliableভাবে করতে হবে।

**File Upload Failure Scenario:**
```text
Admission form submit
      ↓
Image + PDF upload to same web server disk
      ↓
Disk I/O high
      ↓
ASP.NET request wait করে
      ↓
User আবার submit button চাপ দেয়
      ↓
Duplicate application তৈরি হওয়ার ঝুঁকি
```

ভালো ডিজাইনে file upload সরাসরি object storage-এ যাবে, database-এ শুধু file URL বা object key থাকবে, এবং duplicate submit ঠেকাতে application tracking number বা idempotency key থাকবে।

**যেসব সমস্যা শুরু হলো:**
- Login page slow হয়ে গেল, কারণ session এবং user validation একই database-এ চাপ তৈরি করছিল।
- Result publish করার সময় database-এর `Students`, `Results`, `Payments` টেবিলে heavy read শুরু হলো।
- Admission form submit করার সময় file upload slow হয়ে গেল, কারণ web server disk I/O busy হয়ে যাচ্ছিল।
- Payment gateway callback দেরিতে process হওয়ায় অনেক payment successful হলেও receipt pending দেখাচ্ছিল।
- Report generate করার query main transactional database-এ চলছিল, তাই normal user request block হচ্ছিল।
- SMS এবং email synchronous হওয়ায় form submit বা payment confirmation response আটকে থাকতো।
- একটি বড় Excel report generate হলে IIS worker process-এর memory usage বেড়ে যেত।
- Database backup চলার সময় application আরও slow হয়ে যেত।
- Server restart হলে uploaded file, running request এবং pending notification process সব একসাথে প্রভাবিত হতো।

**মূল ডিজাইন সমস্যা:**
- Web application, API, background কাজ, report generation এবং file serving একই server-এ ছিল।
- Database read/write workload আলাদা করা হয়নি।
- Static file বা uploaded document আলাদা object storage-এ রাখা হয়নি।
- Payment callback idempotent করা হয়নি, তাই retry এলে duplicate বা pending state তৈরি হতো।
- SMS/email পাঠানোর জন্য queue ব্যবহার করা হয়নি।
- Result page cache করা হয়নি, অথচ result publish day-তে বেশিরভাগ request একই ধরনের data read করছিল।
- Monitoring, logging, alerting এবং performance metric ঠিকভাবে ছিল না।
- Capacity planning করা হয়নি: peak traffic, storage growth, database size, backup window, report load আগে থেকে হিসাব করা হয়নি।

**ভালো System Design হলে structure এমন হতে পারতো:**
```text
User Browser / Mobile App
          ↓
Load Balancer
          ↓
Multiple Web/API Servers
          ↓
Application Services
     ├── Admission Service
     ├── Payment Service
     ├── Result Service
     ├── Notification Worker
     └── Reporting Worker
          ↓
Database Layer
     ├── Primary SQL Server for write
     ├── Read Replica for result/report read
     └── Backup and archive storage
          ↓
Supporting Infrastructure
     ├── Redis Cache for result and session cache
     ├── Queue for SMS, email, receipt generation
     ├── Object Storage for uploaded files
     ├── CDN for public/static file delivery
     └── Monitoring and centralized logging
```

**Recommended Tech Structure:**
- Frontend: React বা Razor Pages, কিন্তু static assets CDN থেকে serve করা।
- Backend API: ASP.NET Core Web API, stateless design।
- Database: SQL Server Standard/Enterprise with indexing, backup strategy, read replica।
- Cache: Redis, especially result view, session/token cache এবং frequently-read lookup data-এর জন্য।
- Queue: RabbitMQ, Azure Service Bus বা AWS SQS; payment receipt, SMS, email, report generation async করার জন্য।
- File Storage: Azure Blob Storage, AWS S3 বা MinIO; web server local disk নয়।
- Load Balancer: Nginx, IIS ARR, Azure Application Gateway বা AWS ALB।
- Background Worker: .NET Worker Service বা Hangfire।
- Monitoring: Application Insights, Prometheus/Grafana অথবা ELK stack।
- Logging: Structured logging with Serilog, centralized log storage।

**Problem বনাম Design Fix Mapping:**
| Real Problem | Better Design Decision |
| --- | --- |
| Result page বারবার একই data read করছে | Redis cache + read replica |
| Payment callback timeout হচ্ছে | Idempotent callback + queue + retry policy |
| SMS/email পাঠাতে request আটকে যাচ্ছে | Background worker + message queue |
| Report generation database block করছে | Reporting worker + read replica + pre-generated report |
| File upload web server slow করছে | Object storage + signed upload URL |
| Login traffic database চাপাচ্ছে | Stateless auth/token cache + rate limiting |
| Server restart হলে pending কাজ হারিয়ে যাচ্ছে | Durable queue + worker retry |
| Problem কোথায় হচ্ছে বোঝা যাচ্ছে না | Centralized logging + metrics + tracing |


**এই Example থেকে শেখার বিষয়:**
- Small user দিয়ে test করলে system fast মনে হতে পারে, কিন্তু peak traffic আলাদা জিনিস।
- Feature working মানেই system production-ready নয়।
- একই server-এ সব কাজ রাখলে একটি কাজের চাপ অন্য সব কাজকে ধীর করে দেয়।
- Payment, notification, report এবং file upload সাধারণ request-response flow থেকে আলাদা করে ভাবতে হয়।
- Database design শুধু table বানানো নয়; indexing, read/write separation, backup, archive এবং query pattern বুঝতে হয়।
- Real-world system design মানে future load, failure, retry, monitoring এবং recovery নিয়ে আগে থেকে সিদ্ধান্ত নেওয়া।
**কারণ কী?**
কারণ, প্রথম ডিজাইনটি শুধু feature complete করার জন্য বানানো হয়েছিল, কিন্তু peak load, file growth, payment reliability, report workload, notification delay এবং database scaling নিয়ে আগেই ভাবা হয়নি। System Design-এর কাজ হলো শুধু কোড কোথায় লেখা হবে তা ঠিক করা নয়; বরং কোন কাজ কোন component করবে, কোন data কোথায় থাকবে, কোন request synchronous হবে, কোন কাজ queue-তে যাবে, এবং বেশি চাপ এলে system কীভাবে stable থাকবে তা আগে থেকেই ঠিক করা।

## 1.4 Software Development vs System Design
অনেকেই প্রোগ্রামিং আর সিস্টেম ডিজাইনকে একই জিনিস মনে করে থাকেন। কিন্তু তারা সম্পূর্ণ আলাদা দক্ষতা (Skill)।

| Programming (প্রোগ্রামিং) | System Design (সিস্টেম ডিজাইন) |
| --- | --- |
| ছোট বা নির্দিষ্ট ফাংশন লেখা | পুরো সিস্টেমের আর্কিটেকচার ডিজাইন করা |
| লজিক এবং অ্যালগরিদম নিয়ে কাজ করা | স্কেলেবিলিটি এবং ইনফ্রাস্ট্রাকচার নিয়ে ভাবা |
| ফিচার ইমপ্লিমেন্ট করা | রিলায়েবিলিটি (Reliability) এবং পারফরম্যান্স নিয়ে কাজ করা |
| ক্লাস এবং অবজেক্ট ডিজাইন | ক্যাশিং, ডাটাবেজ পার্টিশনিং এবং সার্ভার ক্লাস্টারিং |

---

## 1.5 একজন System Designer কী চিন্তা করেন?

**একজন System Designer আগে কী প্রশ্ন করতেন?**
- Result publish day-তে peak concurrent user কত হতে পারে?
- একই result data কি cache করা যাবে?
- Payment success হলে source of truth কোনটি: gateway, database, না receipt table?
- File upload web server দিয়ে যাবে, নাকি direct object storage-এ যাবে?
- Report কি live database থেকে generate হবে, নাকি background process-এ তৈরি হবে?
- SMS/email fail হলে retry হবে কীভাবে?
- Database backup কখন চলবে, এবং backup চলার সময় user request slow হবে কি না?
- Server down হলে কোন data হারানো যাবে না?
- Monitoring dashboard-এ কোন metric দেখে team বুঝবে system বিপদে আছে?

একজন সিনিয়র সফটওয়্যার ইঞ্জিনিয়ার বা আর্কিটেক্ট কোড লেখার আগে সাধারণত যেসব বিষয়ে গভীরভাবে চিন্তা করেন:
- ভবিষ্যতে যখন ১ লাখ ইউজার হবে, তখন এই সিস্টেম কি কাজ করবে?
- ডাটাবেজ যদি কোনো কারণে ফেইল (Fail) করে, তবে ব্যাকআপ ডাটাবেজ কীভাবে কাজ শুরু করবে?
- সার্ভার ক্র্যাশ হলে রিকভারি (Recovery) কীভাবে হবে?
- API স্লো হলে কীভাবে ক্যাশিং (Caching) করে সেটি অপটিমাইজ (Optimize) করব?
- সিকিউরিটি ব্রিচ (Security breach) বা হ্যাকিং হলে ডাটা কীভাবে সুরক্ষিত রাখব?

## 1.6 Monolith vs Distributed System (আর্কিটেকচার স্টাইল)

### মনোলিথিক আর্কিটেকচার (Monolithic Architecture)
মনোলিথিক সিস্টেমে পুরো সফটওয়্যারের সবকিছু একটিমাত্র অ্যাপ্লিকেশনের ভেতরেই থাকে। 
যেমন একটি ইআরপি এর ভেতরেই Authentication, Inventory, Billing এবং HRM থাকে।

```mermaid
graph TD
    subgraph Monolithic Architecture
        A[Client] --> B(Load Balancer)
        B --> C[Monolithic App<br>Auth, Inventory, Billing, HRM]
        C --> D[(Single Database)]
    end
```

**সুবিধা:**
- তৈরি করা এবং ডেপ্লয় (Deploy) করা খুব সহজ।
- ছোট প্রজেক্টের জন্য খুব দ্রুত কাজ করা যায়।

**সমস্যা:**
- কোডবেস অনেক বড় হয়ে গেলে মেইনটেইন করা কঠিন হয়ে যায়।
- স্কেল করা কঠিন।
- সিস্টেমের যেকোনো এক জায়গায় বাগ (Bug) থাকলে পুরো সিস্টেম ডাউন (Single point of failure) হয়ে যেতে পারে।

### ডিস্ট্রিবিউটেড সিস্টেম (Distributed Architecture / Microservices)
এই পদ্ধতিতে একটি বড় সিস্টেমকে ভেঙে ছোট ছোট স্বাধীন সার্ভিসে (Independent Service) রূপান্তর করা হয়।
যেমন: Auth Service, Payment Service, Notification Service ইত্যাদি।

```mermaid
graph TD
    subgraph Distributed Architecture
        E[Client] --> F(API Gateway)
        F --> G[Auth Service]
        F --> H[Payment Service]
        F --> I[Notification Service]
        F --> J[Reporting Service]
        G --> K[(Auth DB)]
        H --> L[(Payment DB)]
        I --> M[(Notification DB)]
        J --> N[(Reporting DB)]
    end
```

**সুবিধা:**
- প্রতিটি সার্ভিস স্বাধীনভাবে স্কেল করা যায়।
- একটি সার্ভিস ক্র্যাশ করলে অন্য সার্ভিসগুলোতে কোনো প্রভাব পড়ে না।
- ভিন্ন ভিন্ন টিম আলাদা আলাদা সার্ভিস নিয়ে কাজ করতে পারে।

**সমস্যা:**
- আর্কিটেকচার এবং ডেপ্লয়মেন্ট অনেক জটিল (Complex)।
- ডাটা কনসিস্টেন্সি (Data Consistency) রক্ষা করা কঠিন।

## 1.7 Chapter Summary (সারসংক্ষেপ)
এই চ্যাপ্টারে আমরা শিখলাম:
- **System Design কী:** এটি শুধুমাত্র কোড নয়, পুরো সিস্টেমকে নিরবচ্ছিন্নভাবে পরিচালনার ব্লু-প্রিন্ট।
- **প্রয়োজনীয়তা:** ট্রাফিক এবং ডেটা বাড়লে সিস্টেম যাতে স্লো বা ক্র্যাশ না করে।
- **মনোলিথিক বনাম মাইক্রোসার্ভিস:** একটি সিস্টেমে সবকিছু একসাথে রাখা বনাম ছোট ছোট স্বাধীন সার্ভিসে ভাগ করে কাজ করা।
- **এন্টারপ্রাইজ মাইন্ডসেট:** একজন জুনিয়র ডেভেলপার শুধু ফিচার নিয়ে ভাবেন, আর একজন আর্কিটেক্ট সিস্টেমের ভবিষ্যৎ, সিকিউরিটি এবং রিলায়েবিলিটি নিয়ে চিন্তা করেন।

# Chapter 2 — Requirement Analysis & Capacity Planning
Practical System Design in Bangla

## 2.1 কেন Requirement Analysis গুরুত্বপূর্ণ? (রিকোয়ারমেন্ট এনালাইসিসের প্রয়োজনীয়তা)
অনেক সফটওয়্যার প্রজেক্ট ফেইল (fail) বা ব্যর্থ হয় খারাপ কোডিংয়ের কারণে নয়, বরং ইউজারের রিকোয়ারমেন্ট (Requirement) বা চাহিদা ভুল বোঝার কারণে।
বাস্তবে সিস্টেম ডিজাইনের সবচেয়ে বিপজ্জনক (dangerous) পরিস্থিতি হলো:
> "ডেভেলপার এমন একটি সিস্টেম তৈরি করেছে, যা দেখতে অনেক সুন্দর, কিন্তু ক্লায়েন্ট বা বিজনেস ঠিক যা চেয়েছিল, এটি তা করতে পারে না।"

সিস্টেম ডিজাইনের সর্বপ্রথম এবং সবচেয়ে গুরুত্বপূর্ণ ধাপ হলো ক্লায়েন্টের বা সিস্টেমের রিকোয়ারমেন্ট নিখুঁতভাবে বোঝা।

---

## 2.2 Functional vs Non-Functional Requirement
সিস্টেম ডিজাইনে রিকোয়ারমেন্ট সাধারণত দুই ধরনের হয়ে থাকে।

### ১. Functional Requirement (ফাংশনাল রিকোয়ারমেন্ট)
এগুলো সরাসরি ফিচারের (Feature) সাথে যুক্ত। অর্থাৎ, সিস্টেম কী কাজ করবে।
**উদাহরণ (Food Delivery App):**
- ইউজার রেস্টুরেন্টের মেনু দেখতে পারবে।
- ইউজার কার্টে খাবার অ্যাড করে অর্ডার কনফার্ম করতে পারবে।
- রাইডার ট্র্যাকিং (Rider tracking) ম্যাপের মাধ্যমে দেখা যাবে।
- বিকাশ বা কার্ডের মাধ্যমে পেমেন্ট করা যাবে।

### ২. Non-Functional Requirement (নন-ফাংশনাল রিকোয়ারমেন্ট)
এগুলো সিস্টেমের গুণগত মান (Quality) এবং পারফরম্যান্স (Performance) ডিফাইন করে। অর্থাৎ, সিস্টেম কাজগুলো **কত ভালোভাবে** বা **কত দ্রুত** করবে।
**উদাহরণ:**
- সিস্টেমটি একসাথে ১০ লাখ ইউজারের চাপ নিতে পারবে (Scalability)।
- একটি API এর রেসপন্স টাইম ২০০ মিলি-সেকেন্ডের নিচে হবে (Performance)।
- সিস্টেমটি বছরে ৯৯.৯৯% সময় চালু থাকবে (High Availability)।
- ডেটাবেজ হ্যাক হওয়া থেকে সুরক্ষিত থাকবে (Security)।

**নোট:** 
"সিস্টেমকে অবশ্যই ১ মিলিয়ন ইউজার সাপোর্ট করতে হবে"—এটি কোনো ফাংশনাল রিকোয়ারমেন্ট নয়, এটি একটি নন-ফাংশনাল স্কেলেবিলিটি (Scalability) রিকোয়ারমেন্ট।

---

## 2.3 Real World Problem - Requirement Failure
একটি ইআরপি (ERP) সফটওয়্যারে ক্লায়েন্টের রিকোয়ারমেন্ট ছিল:
"আমাদের একটি ইনভেন্টরি রিপোর্ট (Inventory Report) লাগবে।"

ডেভেলপার একটি সুন্দর রিপোর্ট পেজ বানিয়ে দিল। কিন্তু যখন প্রোডাকশনে (Production) রিপোর্টটি রান করা হলো, তখন দেখা গেল:
- রিপোর্ট তৈরি হতে প্রায় ৪ মিনিট সময় লাগছে।
- একসাথে ৫০০ জন ইউজার রিপোর্ট জেনারেট করার চেষ্টা করলে পুরো ডাটাবেজ হ্যাং (hang) হয়ে যাচ্ছে।

**কারণ কী?** 
কারণ শুরুতে শুধুমাত্র ফাংশনাল রিকোয়ারমেন্ট নিয়ে ভাবা হয়েছিল, নন-ফাংশনাল রিকোয়ারমেন্ট (যেমন পারফরম্যান্স) নিয়ে কেউ ভাবেনি।

**সঠিক রিকোয়ারমেন্ট হওয়া উচিত ছিল:**
- রিপোর্টটি সর্বোচ্চ ১০ সেকেন্ডের মধ্যে জেনারেট হতে হবে।
- একসাথে ১০০ জন ইউজার কোনো সমস্যা ছাড়াই রিপোর্ট দেখতে পারবে।
- রিপোর্টটি ব্যাকগ্রাউন্ডে তৈরি হবে (Async processing) এবং পরে নোটিফিকেশন আসবে।

---

## 2.4 Capacity Planning (ক্যাপাসিটি প্ল্যানিং) কী?
ক্যাপাসিটি প্ল্যানিং হলো: ভবিষ্যতে আপনার সিস্টেমটি ঠিক কতটা ডেটা, ট্রাফিক বা লোড (Load) হ্যান্ডেল করবে, তার একটি আগাম গাণিতিক হিসাব বা এস্টিমেশন (Estimation) করা।
সঠিক ক্যাপাসিটি প্ল্যানিং ছাড়া একটি স্কেলেবল আর্কিটেকচার ডিজাইন করা অসম্ভব। 

### কেন এটি জরুরি?
- **Under-estimation (কম হিসাব করা):** ট্রাফিক বেশি আসলে সার্ভার ক্র্যাশ করবে।
- **Over-estimation (বেশি হিসাব করা):** অযথাই সার্ভারের পেছনে অনেক বেশি টাকা নষ্ট হবে।

---

## 2.5 Basic Capacity Estimation (কিভাবে ট্রাফিক হিসাব করবেন?)
ধরি, আপনি একটি ই-কমার্স অ্যাপ্লিকেশন তৈরি করছেন।

- মোট ইউজার: ১ লাখ।
- ডেইলি অ্যাক্টিভ ইউজার (DAU): মোট ইউজারের ২০%।
- প্রতিদিন একেকজন ইউজার গড়ে ৫০টি রিকোয়েস্ট (API call) করে।

**প্রতিদিনের মোট রিকোয়েস্ট (Daily Request):**
`১,০০,০০০ (ইউজার) × ০.২ (অ্যাক্টিভ রেট) × ৫০ (রিকোয়েস্ট) = ১০,০০,০০০ (১০ লাখ) রিকোয়েস্ট প্রতিদিন।`

**Requests Per Second (RPS):**
সাধারণত সব ট্রাফিক সারাদিনে সমানভাবে আসে না। ধরি, পিক আওয়ারে (Peak Hour) মোট ট্রাফিকের ১০% মাত্র ১ ঘণ্টার মধ্যেই চলে আসে।
তাহলে ১ ঘণ্টায় ট্রাফিক: `১০,০০,০০০ × ১০% = ১,০০,০০০ রিকোয়েস্ট।`
তাহলে প্রতি সেকেন্ডে রিকোয়েস্ট (RPS): `১,০০,০০০ / ৩৬০০ সেকেন্ড ≈ ২৮ রিকোয়েস্ট/সেকেন্ড।`

এটাই হলো সিস্টেম ডিজাইনের ভিত্তি। এই RPS অনুযায়ী আপনার সার্ভার এবং ডাটাবেজ নির্বাচন করতে হবে।

---

## 2.6 Storage Estimation (স্টোরেজ হিসাব করা)
ধরি, প্রতিটি ট্রানজ্যাকশনের ডেটা সাইজ গড়ে ৫ কিলোবাইট (5 KB)।
প্রতিদিন ২০ লাখ (2 million) ট্রানজ্যাকশন হয়।

- **প্রতিদিনের ডেটা:** `২,০00,০০০ × ৫ KB = ১০ গিগাবাইট (10 GB) প্রতিদিন।`
- **১ বছরের ডেটা:** `১০ GB × ৩৬৫ দিন = ৩৬৫০ GB (প্রায় ৩.৬ টেরাবাইট)।`

এখন একজন আর্কিটেক্ট বুঝতে পারবেন যে:
- এই বিশাল ডেটার জন্য ডাটাবেজ পার্টিশনিং (Partitioning) করতে হবে কি না।
- পুরনো ডেটা আর্কাইভে (Archive) পাঠাতে হবে কি না।

---

## 2.7 Peak Traffic Thinking (পিক ট্রাফিকের পরিকল্পনা)
ট্রাফিক সব সময় এক রকম থাকে না। 
যেমন: 
- ঈদের দিনের ফ্ল্যাশ সেল (Flash sale)।
- বেতনের দিন (Salary day) ব্যাংকিং অ্যাপ্লিকেশনে চাপ।
- বিশ্ববিদ্যালয়ে ভর্তির রেজাল্টের দিন।

**রিয়েল এক্সাম্পল:**
একটি পেমেন্ট গেটওয়েতে স্বাভাবিক দিনে RPS থাকে ২০০। কিন্তু ঈদের ক্যাম্পেইনের সময় RPS বেড়ে ৮০০০+ হয়ে যায়। সিস্টেমটি ক্র্যাশ করেছিল কারণ:
- কোনো লোড টেস্ট (Load test) করা হয়নি।
- রিকোয়েস্ট হ্যান্ডেল করার জন্য কোনো মেসেজ কিউ (Message Queue) ছিল না।

---

## 2.8 System Design Requirement Checklist
একজন সল্যুশন আর্কিটেক্ট (Solution Architect) সাধারণত রিকোয়ারমেন্ট বোঝার জন্য এই চেকলিস্টটি (Checklist) ফলো করেন:

1. **Business (বিজনেস):**
   - সিস্টেমের মূল উদ্দেশ্য কী? টার্গেট ইউজার কারা?
2. **Traffic (ট্রাফিক):**
   - প্রতিদিন কতজন ইউজার অ্যাক্টিভ থাকবে?
   - পিক টাইমে লোড কেমন হতে পারে?
3. **Data (ডেটা):**
   - কী পরিমাণ ডেটা স্টোর করতে হবে? এর গ্রোথ রেট (Growth rate) কেমন?
4. **Performance (পারফরম্যান্স):**
   - API এর রেসপন্স টাইম কত হওয়া উচিত?
5. **Security (সিকিউরিটি):**
   - পেমেন্ট বা সেনসিটিভ ডেটা এনক্রিপ্ট (Encrypt) করার প্রয়োজন আছে কি না?

---

## 2.9 Chapter Summary (সারসংক্ষেপ)
এই চ্যাপ্টারে আমরা বিস্তারিত শিখলাম:
- **Functional ও Non-functional Requirement:** সিস্টেম কী করবে এবং কতটা নিখুঁতভাবে করবে তার পার্থক্য।
- **Capacity Planning:** ভবিষ্যতে ডেটা এবং ট্রাফিক কেমন হবে তার গাণিতিক হিসাব বের করা।
- **RPS (Requests Per Second) Calculation:** সার্ভারে প্রতি সেকেন্ডে কতগুলো রিকোয়েস্ট আসবে তা বের করা।
- **Storage Estimation:** বছরের পর বছর ডেটা বাড়লে কতটা স্টোরেজ লাগবে তার হিসাব।
- **Peak Traffic:** হঠাৎ ট্রাফিক বেড়ে গেলে সিস্টেমকে কীভাবে প্রস্তুত রাখতে হয়।

# Chapter 3 — Core Architecture Concepts
Scalability, Reliability, Availability & CAP Theorem
Practical System Design in Bangla

## 3.1 Introduction (ভূমিকা)
একটি সফটওয়্যার সিস্টেম যখন তৈরি করা হয়, শুরুতে এটি অনেক ছোট থাকে। 
ধরুন:
- মাত্র ১০ জন ইউজার।
- একটি সাধারণ সার্ভার।
- একটি মাত্র ডাটাবেজ।

এই অবস্থায় সবকিছু খুব মসৃণভাবে (smoothly) চলে। কোনো ল্যাগ বা ডিলে (delay) থাকে না। কিন্তু কয়েক বছর পর যখন সিস্টেমটি বড় হতে শুরু করে, তখন চিত্রটি পুরোপুরি বদলে যায়:
- লাখ লাখ ইউজার প্রতিদিন সিস্টেমে প্রবেশ করে।
- মাল্টিপল API কল হয়।
- মোবাইল অ্যাপ এবং থার্ড-পার্টি ইন্টিগ্রেশন (Third-party integration) যুক্ত হয়।
- রিয়েল-টাইম প্রসেসিং (Real-time processing) এবং নোটিফিকেশন সার্ভিস (Notification service) যুক্ত হয়।

তখন সিস্টেম ডিজাইনের আসল চ্যালেঞ্জ শুরু হয়। কারণ একটি এন্টারপ্রাইজ সিস্টেম (Enterprise System) শুধুমাত্র "ফিচার" দিয়ে টিকে থাকতে পারে না। একটি বড় সিস্টেমকে টিকে থাকতে হলে নিচের বিষয়গুলো শক্তভাবে সামলাতে হয়:
- **Heavy Traffic:** হঠাৎ করে ট্রাফিক বেড়ে যাওয়া।
- **Server Failure:** সার্ভার ক্র্যাশ করা।
- **Database Crash:** ডাটাবেজ লক হয়ে যাওয়া বা ক্র্যাশ করা।
- **Network Issue:** নেটওয়ার্কে সমস্যা হওয়া।
- **Security Attack:** হ্যাকিং বা ডিডস (DDoS) অ্যাটাক।

এই চ্যাপ্টারে আমরা সেই কোর আর্কিটেকচার কনসেপ্টগুলো (Core Architecture Concepts) নিয়ে বিস্তারিত জানব যেগুলো ছাড়া কোনো বড় সিস্টেম ডিজাইন করা একেবারে অসম্ভব।

---

## 3.2 Scalability (স্কেলেবিলিটি) কী?
Scalability বা প্রসারণযোগ্যতা হলো একটি সিস্টেমের সেই ক্ষমতা, যার মাধ্যমে এটি ভবিষ্যতে বৃদ্ধি পাওয়া ডেটা বা ট্রাফিক খুব সহজেই হ্যান্ডেল করতে পারে, কোনো পারফরম্যান্স ডিগ্রেডেশন (Performance degradation) বা সিস্টেম স্লো না করেই।

সহজ ভাষায়:
আজ আপনার সিস্টেমটি ১০০ জন ইউজার হ্যান্ডেল করছে। আগামী বছর যদি:
- ১ লাখ ইউজার হয়।
- ১০ লাখ রিকোয়েস্ট আসে।
- ম্যাসিভ ডেটা (Massive data) তৈরি হয়।
তাহলেও যদি আপনার সিস্টেম একইভাবে স্মুথলি কাজ করতে পারে, তবে বুঝতে হবে আপনার সিস্টেমটি **Scalable (স্কেলেবল)**।

---

## 3.3 Scalability কেন গুরুত্বপূর্ণ?
বেশিরভাগ সিস্টেম শুরুতেই খুব ফাস্ট (fast) থাকে। কারণ তখন ডেটা এবং ইউজারের পরিমাণ অনেক কম থাকে। কিন্তু যখনই স্কেল বা ইউজারের সংখ্যা বাড়তে শুরু করে, তখন সিস্টেমে নানা ধরনের সমস্যা দেখা দেয়:
- রেসপন্স টাইম (Response time) স্লো হয়ে যায়।
- ডাটাবেজে ডেডলক (Database deadlock) তৈরি হয়।
- API রিকোয়েস্ট টাইমআউট (Timeout) হতে থাকে।
- সার্ভারের মেমোরি ওভারফ্লো (Memory overflow) এবং CPU স্পাইক (CPU Spike) করে সিস্টেম ক্র্যাশ করে।

### Real Example — ERP System (বাস্তব উদাহরণ)
একটি গার্মেন্টস ফ্যাক্টরির ERP সিস্টেম শুরু হয়েছিল মাত্র:
- ৩০ জন ইউজার নিয়ে।
- একটি মাত্র ব্রাঞ্চ।
- একটি সিঙ্গেল সার্ভার।

৩ বছর পর কোম্পানির পরিধি বাড়ল:
- ২০০ এর বেশি ফ্যাক্টরি ব্রাঞ্চ।
- ২০,০০০ এর বেশি কর্মচারী।
- বায়োমেট্রিক ডিভাইস ইন্টিগ্রেশন।
- লাইভ রিপোর্টিং সিস্টেম।

**সমস্যা:**
সিস্টেমে লগইন করতে প্রচুর সময় লাগতো (Login delay)। রিপোর্ট তৈরি করতে গিয়ে টাইমআউট হয়ে যেত। ডাটাবেজে ডেডলক সৃষ্টি হতো এবং মাঝে মাঝেই IIS সার্ভার ক্র্যাশ করতো। 
**কারণ:** সিস্টেমটি স্কেলেবল আর্কিটেকচার (Scalable Architecture) দিয়ে তৈরি ছিল না। এটি ছোট স্কেলের কথা ভেবে বানানো হয়েছিল।

---

## 3.4 Types of Scalability (স্কেলেবিলিটির প্রকারভেদ)
সিস্টেম ডিজাইনে সাধারণত দুইভাবে স্কেলেবিলিটি অর্জন করা হয়:
1. **Vertical Scaling (Scale Up):** সার্ভারের ক্ষমতা বা হার্ডওয়্যার বাড়ানো।
2. **Horizontal Scaling (Scale Out):** সার্ভারের সংখ্যা বাড়ানো।

```mermaid
graph TD
    subgraph Vertical Scaling (Scale Up)
        A[Small Server<br>4GB RAM, 2 Core] -->|Upgrade| B[Big Server<br>64GB RAM, 16 Core]
    end
    
    subgraph Horizontal Scaling (Scale Out)
        C[Small Server 1] -->|Add More Servers| D[Load Balancer]
        D --> E[Server 1]
        D --> F[Server 2]
        D --> G[Server 3]
        D --> H[Server 4]
    end
```

---

## 3.5 Vertical Scaling (Scale Up) - বিস্তারিত
এখানে বিদ্যমান সার্ভারের (Existing server) রিসোর্স বা ক্ষমতা বৃদ্ধি করা হয়। 
যেমন: 
- RAM ৮ জিবি থেকে ৬৪ জিবি করা।
- CPU কোর ৪টি থেকে ৩২টি করা।
- হার্ডডিস্ক SSD তে আপগ্রেড করা।

**সুবিধা:**
- এটি করা অত্যন্ত সহজ।
- কোডে বা ডেপ্লয়মেন্টে (Deployment) কোনো পরিবর্তনের প্রয়োজন হয় না।
- কনফিগারেশন খুবই সাধারণ থাকে।

**সমস্যা:**
- এটি অনেক ব্যয়বহুল (Expensive)।
- হার্ডওয়্যার আপগ্রেড করার একটি নির্দিষ্ট লিমিট থাকে (আপনি চাইলেই একটি মেশিনে অসীম RAM বসাতে পারবেন না)।
- **Single Point of Failure (SPOF):** সার্ভারটি কোনো কারণে ক্র্যাশ করলে পুরো সিস্টেম ডাউন হয়ে যাবে।

---

## 3.6 Horizontal Scaling (Scale Out) - বিস্তারিত
এখানে সার্ভারের ক্ষমতা না বাড়িয়ে, বরং একাধিক নতুন সার্ভার যুক্ত করা হয়। এবং একটি **Load Balancer (লোড ব্যালেন্সার)** ব্যবহার করে ট্রাফিকগুলো সব সার্ভারের মধ্যে সমানভাবে ভাগ করে দেওয়া হয়।

**Architecture Flow:**
`Client Request -> Load Balancer -> Server 1 / Server 2 / Server 3`

**সুবিধা:**
- এটি Highly Scalable (যত খুশি সার্ভার বাড়ানো যায়)।
- Fault Tolerant (একটি সার্ভার নষ্ট হলে বাকিগুলো দিয়ে সিস্টেম চলতে থাকে)।
- Enterprise System এর জন্য সবচেয়ে উপযোগী।

**সমস্যা:**
- আর্কিটেকচারটি বেশ জটিল (Complex)।
- ইউজারের সেশন (Session) ম্যানেজ করা কঠিন হয়ে যায়।
- সব সার্ভার একসাথে মনিটরিং করা কিছুটা কষ্টসাধ্য।

---

## 3.7 Reliability (নির্ভরযোগ্যতা) কী?
Reliability বা নির্ভরযোগ্যতা হলো একটি সিস্টেম কতটা ধারাবাহিকভাবে এবং নির্ভুলভাবে (consistently & accurately) তার কাজ করতে পারে তার পরিমাপ। 

**উদাহরণ:**
পেমেন্ট সিস্টেমে যদি এমন হয় যে:
- ইউজারের অ্যাকাউন্ট থেকে টাকা কাটা গেছে।
- কিন্তু ট্রানজ্যাকশন (Transaction) ডাটাবেজে সেভ হয়নি।
তাহলে এই সিস্টেমটি মোটেও Reliable বা নির্ভরযোগ্য নয়।

**একটি Reliable System এর বৈশিষ্ট্য:**
- Consistent (ধারাবাহিক ফলাফল দেয়)।
- Predictable (আচরণ অনুমানযোগ্য)।
- Fault Resistant (ভুল বা ফেইলিওর সামলাতে পারে)।

---

## 3.8 Availability (প্রাপ্যতা বা এভেইলেবিলিটি) কী?
Availability হলো একটি সিস্টেম তার ইউজারদের জন্য কতটুকু সময় অ্যাক্সেসযোগ্য বা ব্যবহারযোগ্য (Accessible/Usable) থাকে। 

Availability পরিমাপের ফর্মুলা:
`Availability = Uptime / (Uptime + Downtime)`

**উদাহরণ:**
যদি কোনো সিস্টেম বছরে ৩৬৪ দিন আপ থাকে এবং ১ দিন ডাউন থাকে, তবে তার Availability:
`364 / 365 = 99.7%`

### Availability Levels (এভেইলেবিলিটির মানদণ্ড)
| Availability Level | Downtime Per Year (বছরে ডাউনটাইম) |
| --- | --- |
| 99% | প্রায় ৩.৬৫ দিন |
| 99.9% | প্রায় ৮.৭ ঘন্টা |
| 99.99% | প্রায় ৫২ মিনিট |
| 99.999% (Five Nines) | প্রায় ৫ মিনিট |

```mermaid
graph LR
    subgraph High Availability Architecture
        User --> LB[Load Balancer]
        LB -->|Traffic| App1[App Server 1 - Active]
        LB -->|Traffic| App2[App Server 2 - Active]
        LB -.->|Failover Backup| App3[App Server 3 - Standby]
    end
```

---

## 3.9 Fault Tolerance (ফল্ট টলারেন্স) কী?
Fault Tolerance বা ত্রুটি সহনশীলতা মানে হলো সিস্টেমের কোনো একটি অংশ (Component) ফেইল করলেও যেন পুরো সিস্টেম ডাউন না হয়ে যায়। সিস্টেম যেন তার কাজ চালিয়ে যেতে পারে।

**বাস্তব উদাহরণ:**
একটি ফুড ডেলিভারি অ্যাপ্লিকেশনে যদি নোটিফিকেশন সার্ভিস (Notification Service) ক্র্যাশ করে, তবে শুধু SMS বা পুশ নোটিফিকেশন যাওয়া বন্ধ হবে। কিন্তু ইউজারের অর্ডার করা এবং পেমেন্ট সিস্টেম যেন ঠিকমতো কাজ করে। এটাই হলো Fault Tolerance।

---

## 3.10 Single Point of Failure (SPOF)
SPOF বলতে সিস্টেমের এমন কোনো একটি নির্দিষ্ট অংশকে বোঝায়, যেটি ফেইল করলে পুরো সিস্টেম পুরোপুরি বন্ধ হয়ে যায়।
বড় সিস্টেমে কোনোভাবেই SPOF রাখা যাবে না।

**SPOF এর উদাহরণ:**
- শুধুমাত্র একটি ডাটাবেজ সার্ভার থাকা।
- শুধুমাত্র একটি অ্যাপ সার্ভার থাকা।
- একটি মাত্র লোড ব্যালেন্সার থাকা।

---

## 3.11 CAP Theorem (ক্যাপ থিওরেম)
ডিস্ট্রিবিউটেড সিস্টেমের (Distributed System) সবচেয়ে গুরুত্বপূর্ণ একটি থিওরি হলো CAP Theorem। এটি অনুযায়ী, একটি ডিস্ট্রিবিউটেড সিস্টেম একই সাথে নিচের ৩টি গ্যারান্টি পুরোপুরি দিতে পারে না, যেকোনো ২টি দিতে পারে:

1. **C = Consistency (ধারাবাহিকতা):** প্রতিটি নোড বা সার্ভার সবসময় একই এবং লেটেস্ট (Latest) ডেটা দেখাবে।
2. **A = Availability (প্রাপ্যতা):** প্রতিটি রিকোয়েস্টের একটি সফল বা ব্যর্থ রেসপন্স সবসময় পাওয়া যাবে, সিস্টেম কখনো হ্যাং করবে না।
3. **P = Partition Tolerance (পার্টিশন টলারেন্স):** নেটওয়ার্কের কোনো সমস্যার কারণে দুই বা ততোধিক সার্ভারের মধ্যে যোগাযোগ বিচ্ছিন্ন হলেও সিস্টেম কাজ চালিয়ে যেতে পারবে।

```mermaid
pie title CAP Theorem Trade-offs
    "Consistency (C)": 33.3
    "Availability (A)": 33.3
    "Partition Tolerance (P)": 33.3
```

### CAP Theorem এর বাস্তবতা
যেহেতু ডিস্ট্রিবিউটেড সিস্টেমে নেটওয়ার্ক ইস্যু (Network Issue) হওয়াটা অনিবার্য, তাই **Partition Tolerance (P) সবসময়ের জন্য বাধ্যতামূলক**। 
ফলে আমাদের দুটি অপশনের মধ্যে যেকোনো একটি বেছে নিতে হয়:
- **CP System (Consistency + Partition Tolerance):** 
  ব্যাংকিং সিস্টেমে এটি ব্যবহার হয়। নেটওয়ার্ক ডাউন থাকলে সিস্টেম এরর দিবে (Availability কমবে), কিন্তু ভুল ব্যালেন্স দেখাবে না।
- **AP System (Availability + Partition Tolerance):** 
  সোশ্যাল মিডিয়াতে (যেমন ফেসবুক) এটি ব্যবহার হয়। পোস্ট সাথে সাথে আপডেট না হলেও সিস্টেম সবসময় রেসপন্স করবে এবং চলবে।

---

## 3.12 Chapter Summary (সারসংক্ষেপ)
এই চ্যাপ্টারে আমরা বিস্তারিতভাবে শিখলাম:
- **Scalability:** সিস্টেম কীভাবে বড় ট্রাফিক হ্যান্ডেল করতে পারে (Vertical vs Horizontal)।
- **Reliability ও Availability:** সিস্টেমের নির্ভরযোগ্যতা এবং এটি কতটুকু সময় সচল থাকে।
- **Fault Tolerance ও SPOF:** সিস্টেমের কোনো অংশ নষ্ট হলেও কাজ চালিয়ে যাওয়ার ক্ষমতা এবং এর ডিজাইনের গুরুত্ব।
- **CAP Theorem:** ডিস্ট্রিবিউটেড সিস্টেমের সবচেয়ে মৌলিক থিওরি এবং এর ট্রেড-অফ (Trade-offs)।

এই কনসেপ্টগুলো মাথায় রাখা একজন সল্যুশন আর্কিটেক্ট (Solution Architect) বা সিনিয়র ইঞ্জিনিয়ারের প্রধান কাজ। পরবর্তী চ্যাপ্টারে আমরা ডাটাবেজ স্কেলিং নিয়ে বিস্তারিত জানব।

# Chapter 4 — Database Design Fundamentals
SQL, NoSQL, Indexing, Transactions & Enterprise Database Thinking
Practical System Design in Bangla

## 4.1 Introduction (ভূমিকা)
একটি সফটওয়্যার সিস্টেমের প্রাণ বা হার্ট (Heart) হলো তার ডাটাবেজ (Database)। 
অ্যাপ্লিকেশনের কোড ভুল হলে বা স্লো হলে তা পরিবর্তন করা তুলনামূলকভাবে সহজ। কিন্তু ডাটাবেজ ডিজাইনে যদি বড় ধরনের কোনো ভুল থাকে, তবে তার প্রভাব পুরো সিস্টেমের ওপর ভয়াবহ হতে পারে।

কারণ একটি ডাটাবেজ শুধু ডেটা সেভ করে না, এটি হ্যান্ডেল করে:
- **Business Data:** গুরুত্বপূর্ণ ব্যাবসায়িক তথ্য।
- **Transactions:** টাকা বা অর্ডারের লেনদেন।
- **Reporting & Analytics:** মাস বা বছর শেষের বিশাল বিশাল রিপোর্ট।
- **Concurrency:** একই সময়ে হাজার হাজার ইউজারের রিকোয়েস্ট।

অনেক জুনিয়র ডেভেলপার মনে করে: *"কয়েকটি টেবিল (Table) তৈরি করলেই ডাটাবেজ ডিজাইন শেষ।"*
কিন্তু এন্টারপ্রাইজ লেভেলে (Enterprise Level) ডাটাবেজ ডিজাইন মানে হলো স্কেলেবিলিটি (Scalability), পারফরম্যান্স (Performance), কনকারেন্সি (Concurrency), ইনডেক্সিং (Indexing) এবং ব্যাকআপ রিকভারি (Backup & Recovery) একসাথে মেইনটেইন করা।

## 4.2 Real Production Story — Bad Database Design (ডাটাবেজ ডিজাইনের ভুল এবং তার পরিণতি)
একটি ইআরপি (ERP) সিস্টেমের শুরুতে:
- ইউজার ছিল ২০ জন।
- একটি মাত্র ব্রাঞ্চ।
- সিস্টেমটি খুবই ফাস্ট (Fast) কাজ করছিল।

**ডাটাবেজের অবস্থা ছিল এমন:**
- কোনো ইনডেক্সিং (Indexing) ছিল না।
- টেবিলগুলো ছিল বিশাল, কোনো সম্পর্ক (Normalization) ঠিকমতো ছিল না।
- সব ফিল্ডে অযথাই `VARCHAR(MAX)` ব্যবহার করা হয়েছিল।
- পুরনো ডেটা আর্কাইভ (Archive) করার কোনো মেকানিজম ছিল না।

**৩ বছর পর সিস্টেমের অবস্থা:**
- ১৫০০ এর বেশি ব্রাঞ্চ যুক্ত হয়েছে।
- কোটি কোটি ট্রানজ্যাকশন হচ্ছে।
- API কল করতে গেলেই টাইমআউট (Timeout) দেখাচ্ছে।
- একটি সাধারণ রিপোর্ট লোড হতে ৫-১০ মিনিট সময় নিচ্ছে।
- প্রায়ই ডেডলক (Deadlock) তৈরি হয়ে সিস্টেম হ্যাং করে যাচ্ছে।

**সমাধান:** 
পুরো ডাটাবেজটিকে নতুন করে রিডিজাইন (Redesign) করতে হয়েছিল, যা ছিল অত্যন্ত ব্যয়বহুল এবং সময়সাপেক্ষ। একটি ভুল ডাটাবেজ আর্কিটেকচার পুরো কোম্পানিকে ব্যবসায়িক ক্ষতির মুখে ফেলতে পারে।

## 4.3 Database কী এবং এর প্রকারভেদ
Database হলো সুসংগঠিতভাবে ডেটা সংরক্ষণ করার একটি ব্যবস্থা। প্রধানত ডাটাবেজ দুই প্রকারের হয়ে থাকে:

1. **Relational Database (SQL):** SQL Server, PostgreSQL, MySQL, Oracle.
2. **Non-Relational Database (NoSQL):** MongoDB, Cassandra, Redis, DynamoDB.

## 4.4 SQL Database (রিলেশনাল ডাটাবেজ)
SQL ডাটাবেজগুলো একটি নির্দিষ্ট টেবিল স্ট্রাকচার (Table Structure) বা স্কিমা (Schema) মেনে চলে। ডেটা রো (Row) এবং কলাম (Column) আকারে সেভ হয়।

**মূল বৈশিষ্ট্য:**
- **Structured Schema:** টেবিলের কলাম আগে থেকেই ঠিক করা থাকে। কলামের বাইরে কোনো ডেটা ঢোকানো যায় না।
- **ACID Transactions:** ডেটার কনসিস্টেন্সি (Consistency) বা নির্ভরযোগ্যতা শতভাগ নিশ্চিত করে।
- **Relationship Support:** Foreign Key এর মাধ্যমে একাধিক টেবিলের (যেমন: User এবং Order টেবিল) মধ্যে চমৎকার সম্পর্ক তৈরি করা যায়।

> **কখন SQL ব্যবহার করবেন?**
> যখন সিস্টেমে ট্রানজ্যাকশন, রিপোর্ট এবং ডেটার নির্ভুলতা সবচেয়ে বেশি জরুরি। যেমন: ব্যাংকিং সিস্টেম (Banking System), অ্যাকাউন্টিং (Accounting / ERP), ইনভেন্টরি ম্যানেজমেন্ট (Inventory)।

## 4.5 NoSQL Database (নন-রিলেশনাল ডাটাবেজ)
NoSQL ডাটাবেজে কোনো ফিক্সড স্কিমা (Fixed Schema) থাকে না। ডেটাগুলো সাধারণত JSON ডকুমেন্টের মতো করে সেভ হয়।

**মূল বৈশিষ্ট্য:**
- **Flexible Schema:** যেকোনো সময় ডেটার ফিল্ড পরিবর্তন করা যায়। আগের ডেটার ওপর কোনো প্রভাব পড়ে না।
- **Horizontally Scalable:** অনেকগুলো সার্ভারে খুব সহজেই ডেটা ছড়িয়ে (Distributed) দেওয়া যায়।
- **High Write Throughput:** প্রতি সেকেন্ডে লক্ষ লক্ষ ডেটা রাইট (Write) করার ক্ষমতা রাখে।

> **কখন NoSQL ব্যবহার করবেন?**
> যখন সিস্টেমে প্রচুর পরিমাণে আনস্ট্রাকচার্ড ডেটা (Unstructured Data) এবং হাই স্কেল (High Scale) দরকার হয়। যেমন: সোশ্যাল মিডিয়া (ফেসবুকের পোস্ট বা কমেন্ট), রিয়েল-টাইম এনালিটিক্স (Real-time Analytics), আইওটি (IoT Sensor Data)।

### SQL vs NoSQL: একটি তুলনামূলক চিত্র

| বৈশিষ্ট্য (Feature) | SQL (যেমন: PostgreSQL) | NoSQL (যেমন: MongoDB) |
| --- | --- | --- |
| **Schema (স্কিমা)** | ফিক্সড বা নির্দিষ্ট | ফ্লেক্সিবল বা পরিবর্তনশীল |
| **Transaction** | ১০০% ACID গ্যারান্টি দেয় | খুবই লিমিটেড সাপোর্ট |
| **Scaling (স্কেলিং)** | ভার্টিক্যালি স্কেল করা সহজ | হরাইজন্টালি স্কেল করা খুব সহজ |
| **Relationship** | Foreign Key দিয়ে অত্যন্ত শক্তিশালী | সাধারণত রেফারেন্স দিয়ে করা হয় (দুর্বল) |
| **Data Format** | Row এবং Column (টেবিল) | JSON, Key-Value, Graph |

## 4.6 Hybrid Database Architecture (হাইব্রিড আর্কিটেকচার)
বড় বড় এন্টারপ্রাইজ সিস্টেমে সাধারণত একটিমাত্র ডাটাবেজ দিয়ে সব কাজ করা হয় না। কাজের ধরন অনুযায়ী একাধিক ডাটাবেজ একসাথে ব্যবহার করা হয়। একে পলিগ্লট পারসিস্টেন্স (Polyglot Persistence) বলা হয়।

**বাস্তব উদাহরণ (Fintech System):**
- **Transactions:** টাকার লেনদেনের জন্য `SQL Server` বা `PostgreSQL` ব্যবহার হয়।
- **Cache / Session:** ইউজারের লগইন সেশন দ্রুত লোড করার জন্য `Redis` ব্যবহার হয়।
- **Activity Logging:** ইউজার সিস্টেমে কোথায় কোথায় ক্লিক করছে, তার লগ রাখার জন্য `MongoDB` ব্যবহার হয়।

## 4.7 Transactions এবং ACID Properties
একটি Transaction হলো একাধিক ডেটাবেজ অপারেশনের একটি বান্ডেল, যা একটি একক ইউনিট হিসেবে কাজ করে।

**উদাহরণ (টাকা ট্রান্সফার):**
১. রহিম এর অ্যাকাউন্ট থেকে ১০০০ টাকা কাটা হবে।
২. করিম এর অ্যাকাউন্টে ১০০০ টাকা যোগ হবে।

এই দুটি কাজ মিলে একটি Transaction। যদি কোনো কারণে ২ নম্বর কাজটি ব্যর্থ হয়, তবে ১ নম্বর কাজটি বাতিল (Rollback) হয়ে যাবে। রহিমের টাকা ফেরত চলে আসবে। ডাটাবেজে এই নিশ্চয়তা দেওয়ার জন্য **ACID Properties** ব্যবহার করা হয়।

```mermaid
graph LR
    subgraph ACID Properties
        A[Atomicity<br/>All or Nothing]
        C[Consistency<br/>Valid State]
        I[Isolation<br/>Independent Execution]
        D[Durability<br/>Saved Permanently]
    end
```

- **A = Atomicity (অ্যাটমিসিটি):** সব কাজ সফল হবে, অথবা কোনো কাজই হবে না। অর্ধেক ট্রানজ্যাকশন কখনো সেভ হবে না।
- **C = Consistency (কনসিস্টেন্সি):** ডেটা সবসময় একটি সঠিক এবং ভ্যালিড অবস্থায় (Valid state) থাকবে।
- **I = Isolation (আইসোলেশন):** একাধিক ইউজার একই সাথে ডেটাবেজে ট্রানজ্যাকশন করলেও একটির প্রভাব আরেকটির ওপর পড়বে না।
- **D = Durability (ডিউরেবিলিটি):** একবার ট্রানজ্যাকশন সেভ (Commit) হয়ে গেলে, সার্ভার রিস্টার্ট নিলেও সেই ডেটা হারিয়ে যাবে না।

## 4.8 Indexing (ইনডেক্সিং) এবং Query Optimization
বইয়ের পেছনে যেমন একটি Index পেজ থাকে, যা দিয়ে যেকোনো টপিক খুব দ্রুত খুঁজে বের করা যায়, ডাটাবেজের Index-ও ঠিক একইভাবে কাজ করে। সাধারণত ডাটাবেজে B-Tree (Balanced Tree) ডেটা স্ট্রাকচার ব্যবহার করে ইনডেক্সিং করা হয়।

### ইনডেক্স ছাড়া (Full Table Scan):
আপনি যদি ১০ লাখ ইউজারের একটি টেবিল থেকে রহিমের নাম খুঁজতে যান, ডাটাবেজকে ১ থেকে ১০ লাখ পর্যন্ত সবগুলো রো (Row) স্ক্যান করে চেক করতে হবে। এটি ডাটাবেজকে ভয়াবহ স্লো করে দেয়। একে বলা হয় O(N) কমপ্লেক্সিটি।

### ইনডেক্স ব্যবহার করলে (Index Seek):
ডাটাবেজ সরাসরি ইনডেক্সিং ট্রি (B-Tree) ব্যবহার করে মাত্র কয়েক মিলি-সেকেন্ডের মধ্যে রহিমের ডেটা খুঁজে বের করে আনবে। এটি O(log N) কমপ্লেক্সিটিতে কাজ করে, যা অত্যন্ত দ্রুত।

```mermaid
graph TD
    subgraph How B-Tree Index Works
        Root[Root Node<br/>ID: 50]
        Root --> Left[Left Child<br/>ID < 50]
        Root --> Right[Right Child<br/>ID > 50]
        
        Left --> L1[ID: 10-25]
        Left --> L2[ID: 26-49]
        
        Right --> R1[ID: 51-75]
        Right --> R2[ID: 76-100]
    end
```

**সতর্কতা (Over Indexing Problem):**
অতিরিক্ত ইনডেক্স তৈরি করলে ডেটা রিড (Read/Select) ফাস্ট হয় ঠিকই, কিন্তু নতুন ডেটা ইনসার্ট (Insert) বা আপডেট (Update) করার সময় ডাটাবেজ চরম স্লো হয়ে যায়। কারণ প্রতিটি ইনসার্টের সময় সবগুলো ইনডেক্স রি-ক্যালকুলেট (Re-calculate) করতে হয়। 
এন্টারপ্রাইজ ডাটাবেজ অ্যাডমিনিস্ট্রেটরদের (DBA) গোল্ডেন রুল হলো: *"Every index has a cost. Use them wisely."*

## 4.9 Chapter Summary (সারসংক্ষেপ)
এই চ্যাপ্টারে আমরা শিখলাম:
- **Database Design এর গুরুত্ব:** কেন একটি ভুল ডিজাইন পুরো সিস্টেমকে ধসিয়ে দিতে পারে।
- **SQL vs NoSQL:** ডাটাবেজের প্রকারভেদ এবং প্রোজেক্ট অনুযায়ী সঠিক ডাটাবেজ নির্বাচন।
- **Hybrid Database:** বড় সিস্টেমে একাধিক ভিন্ন প্রযুক্তির ডাটাবেজের ব্যবহার।
- **Transactions & ACID:** ব্যাংকিং ও ইআরপি সিস্টেমে ডেটার ১০০% কনসিস্টেন্সি কীভাবে মেইনটেইন করা হয়।
- **Indexing & B-Tree:** কীভাবে ফুল টেবিল স্ক্যান (Full Table Scan) এড়িয়ে কুয়েরি পারফরম্যান্স (Query performance) হাজার গুণ ফাস্ট করা যায়।

পরবর্তী চ্যাপ্টারে আমরা ডাটাবেজের অ্যাডভান্সড স্কেলিং (Advanced Database Scaling), পার্টিশনিং (Partitioning) এবং রিড রেপ্লিকা (Read Replica) নিয়ে বিস্তারিত জানব।

# Chapter 5 — Advanced Database Scaling & High Performance Architecture
Partitioning, Sharding, Replication, CQRS & Billion Scale Data Systems
Practical System Design in Bangla

## 5.1 Introduction (ভূমিকা)
ডাটাবেজ ডিজাইন করা এক জিনিস, কিন্তু ডাটাবেজকে স্কেল (Scale) করা সম্পূর্ণ আলাদা এবং অত্যন্ত জটিল একটি দক্ষতা (Skill)।
ছোট সিস্টেমে:
- একটিমাত্র ডাটাবেজ থাকে।
- ১০টি টেবিল থাকে।
- ১০০ জন ইউজার থাকে।
এ অবস্থায় সবকিছু চমৎকারভাবে কাজ করে। কিন্তু যখন সিস্টেম বড় হয়ে যায়:
- লাখো ইউজার একসাথে সিস্টেমে ঢোকে।
- কোটি কোটি ট্রানজ্যাকশন হতে থাকে।
- রিয়েল-টাইম এনালিটিক্স এবং মোবাইল API এর রিকোয়েস্ট আসতে থাকে।

ঠিক তখন ডাটাবেজ হয়ে যায় পুরো সিস্টেমের সবচেয়ে বড় বটলনেক (Bottleneck) বা বাধা। কারণ সার্ভার খুব সহজে স্কেল করা গেলেও, ডাটাবেজ স্কেল করা অনেক কঠিন।

---

## 5.2 Database Scaling কেন এত কঠিন?
সার্ভার (যেমন API Server) স্কেল করা খুব সহজ, কারণ তারা সাধারণত স্টেটলেস (Stateless) হয়। কিন্তু ডাটাবেজের ভেতরে স্টেট বা ডেটা থাকে। ডাটাবেজ স্কেলিং কঠিন হওয়ার মূল কারণগুলো হলো:
1. **Data Consistency (ধারাবাহিকতা):** ডেটা একাধিক সার্ভারে ছড়িয়ে দিলেও সব জায়গায় যেন একই ডেটা দেখায়, তা নিশ্চিত করা খুব কঠিন।
2. **Transaction Safety:** ব্যাংকের লেনদেনের মতো বিষয়গুলো যেন কোনোভাবেই মাঝপথে আটকে না যায় তা নিশ্চিত করতে হয়।
3. **Concurrency:** একই সময়ে একাধিক ইউজার একই ডেটা মডিফাই করার চেষ্টা করলে কে আগে সুযোগ পাবে, তা সামলানো।

---

## 5.3 Vertical vs Horizontal Database Scaling

### Vertical Scaling (Scale Up)
আপনার বিদ্যমান ডাটাবেজ সার্ভারের সিপিইউ (CPU), র‍্যাম (RAM) এবং এসএসডি (SSD) বাড়িয়ে দেওয়া।
- **সমস্যা:** এর একটি নির্দিষ্ট লিমিট আছে এবং এটি অত্যন্ত ব্যয়বহুল। এছাড়া সার্ভার ক্র্যাশ করলে সব ডেটা অফলাইন হয়ে যায় (Single Point of Failure)।

### Horizontal Scaling (Scale Out)
ডাটাবেজের ডেটাগুলোকে অনেকগুলো ছোট ছোট ডাটাবেজ সার্ভারে ভাগ করে দেওয়া।
- **সুবিধা:** এটি আনলিমিটেড স্কেল (Unlimited Scale) করা যায় এবং ফল্ট টলারেন্ট (Fault tolerant)।

---

## 5.4 Database Partitioning (পার্টিশনিং)
Partitioning মানে হলো একটি বিশাল টেবিলকে লজিক্যালি ছোট ছোট ভাগে ভাগ করে দেওয়া, যাতে কুয়েরি খুব দ্রুত কাজ করে।

**উদাহরণ (Range Partitioning):**
ধরি একটি `Transactions` টেবিলে ১০ কোটি ডেটা আছে। আমরা এটিকে মাস অনুযায়ী ভাগ করতে পারি:
- Partition 1: January Data
- Partition 2: February Data
- Partition 3: March Data

**সুবিধা:** 
যখন কোনো ইউজার শুধু ফেব্রুয়ারির ডেটা খুঁজবে, তখন ডাটাবেজকে ১০ কোটি ডেটা স্ক্যান করতে হবে না। সে সরাসরি Partition 2 থেকে ডেটা নিয়ে আসবে। এতে পারফরম্যান্স ম্যাজিকের মতো ইম্প্রুভ করে।

---

## 5.5 Database Sharding (শার্ডিং)
Sharding হলো ডাটাবেজকে হরাইজন্টালি (Horizontally) ভাগ করা। অর্থাৎ, ডেটাগুলোকে ফিজিক্যালি (Physically) আলাদা আলাদা ডাটাবেজ সার্ভারে স্টোর করা।

**কীভাবে কাজ করে?**
ধরি, আমাদের ১ কোটি ইউজার আছে। আমরা ৩টি ডাটাবেজ (Shard) তৈরি করলাম:
- **Shard 1 (DB 1):** User ID 1 থেকে 33 Lakh পর্যন্ত।
- **Shard 2 (DB 2):** User ID 33 Lakh থেকে 66 Lakh পর্যন্ত।
- **Shard 3 (DB 3):** User ID 66 Lakh থেকে 1 Crore পর্যন্ত।

```mermaid
graph TD
    User --> API[API Gateway]
    API --> Router[Shard Router]
    
    Router -->|User 1-33L| Shard1[(Database Shard 1)]
    Router -->|User 33L-66L| Shard2[(Database Shard 2)]
    Router -->|User 66L-1C| Shard3[(Database Shard 3)]
```

**Sharding এর চ্যালেঞ্জ:**
- এক Shard এর ডেটার সাথে অন্য Shard এর ডেটা জয়েন (JOIN) করা যায় না।
- ডিস্ট্রিবিউটেড ট্রানজ্যাকশন (Distributed transaction) মেইনটেইন করা অত্যন্ত জটিল।

---

## 5.6 Database Replication (রেপ্লিকেশন)
Replication মানে হলো মূল ডাটাবেজের ডেটা হুবহু কপি করে অন্য একাধিক ডাটাবেজ সার্ভারে রাখা।

**Master-Slave (বা Primary-Replica) Architecture:**
- **Primary DB (Master):** শুধুমাত্র নতুন ডেটা ইনসার্ট (Insert/Write) করার জন্য ব্যবহার হয়।
- **Replica DB (Slave):** শুধুমাত্র ডেটা রিড (Read/Select) করার জন্য ব্যবহার হয়।

**কেন এটি গুরুত্বপূর্ণ?**
বেশিরভাগ সিস্টেমে (যেমন ই-কমার্স বা সোশ্যাল মিডিয়া) Write এর চেয়ে Read অনেক বেশি হয়। Read Replica ব্যবহার করলে Primary ডাটাবেজের ওপর থেকে প্রচুর লোড কমে যায়।

```mermaid
graph LR
    API[Application API] -->|Write (Insert/Update)| Primary[(Primary Database)]
    Primary -->|Async Sync| Replica1[(Read Replica 1)]
    Primary -->|Async Sync| Replica2[(Read Replica 2)]
    API -->|Read (Select)| Replica1
    API -->|Read (Select)| Replica2
```

---

## 5.7 CQRS Pattern (সি-কিউ-আর-এস)
CQRS এর পূর্ণরূপ হলো **Command Query Responsibility Segregation**।
এর মূল কথা হলো: ডেটা Write করার লজিক এবং ডেটা Read (Report) করার লজিক সম্পূর্ণ আলাদা করে ফেলা।

**বাস্তব উদাহরণ (ERP System):**
ইআরপি সিস্টেমে যখন মাসের শেষে বিশাল রিপোর্ট (Report) জেনারেট করা হয়, তখন পুরো ডাটাবেজ স্লো হয়ে যায়। এর সমাধান হিসেবে CQRS ব্যবহার করা হয়:
- **Write Database:** শুধুমাত্র ট্রানজ্যাকশনের জন্য (খুবই দ্রুত কাজ করে)।
- **Read Database (Reporting):** ব্যাকগ্রাউন্ডে মেসেজ কিউ (Kafka/RabbitMQ) এর মাধ্যমে Write DB থেকে ডেটা এখানে সিঙ্ক (Sync) হয়। সব ভারী রিপোর্ট এখান থেকে জেনারেট হয়, ফলে মেইন সিস্টেমে কোনো সমস্যা হয় না।

---

## 5.8 Chapter Summary (সারসংক্ষেপ)
এই চ্যাপ্টারে আমরা ডাটাবেজ স্কেলিং এর কোর কনসেপ্টগুলো শিখলাম:
- **Vertical vs Horizontal Scaling:** ডাটাবেজ সার্ভার বড় করা বনাম সার্ভারের সংখ্যা বাড়ানো।
- **Partitioning:** একটি বড় টেবিলকে লজিক্যাল ছোট অংশে ভাগ করে কুয়েরি ফাস্ট করা।
- **Sharding:** বিশাল ডেটাকে একাধিক ফিজিক্যাল সার্ভারে ডিস্ট্রিবিউট করা।
- **Replication ও Read Replica:** রিড এবং রাইট অপারেশন আলাদা করে পারফরম্যান্স বৃদ্ধি করা।
- **CQRS:** ট্রানজ্যাকশন এবং রিপোর্টিং ডাটাবেজ পুরোপুরি আলাদা করে ফেলা।

# Chapter 6 — Caching Architecture & Performance Engineering
Redis, Distributed Cache, CDN, Cache Invalidation & Real Production Scaling
Practical System Design in Bangla

## 6.1 Introduction (ভূমিকা)
একটি সিস্টেম স্লো (Slow) হওয়ার সবচেয়ে সাধারণ এবং প্রধান কারণ হলো: 
> "প্রতিটি রিকোয়েস্ট সরাসরি ডাটাবেজে হিট করছে।"

ছোট সিস্টেমে এটি কোনো সমস্যা নয়। কিন্তু সিস্টেম যখন বড় হয় এবং ট্রাফিক বাড়ে, তখন ডাটাবেজে একই ডেটার জন্য বারবার কুয়েরি (Query) আসতে থাকে। এর ফলে:
- ডাটাবেজ ওভারলোড (Overload) হয়ে যায়।
- CPU স্পাইক (Spike) করে ১০০% এ চলে যায়।
- API রেসপন্স স্লো হয়ে যায় বা টাইমআউট (Timeout) মারে।

এই সমস্যার চূড়ান্ত সমাধান হলো **Caching (ক্যাশিং)**। ক্যাশিং ব্যবহার করে আমরা আমাদের সিস্টেমকে ১০ থেকে ১০০ গুণ পর্যন্ত ফাস্ট (Faster) করতে পারি।

---

## 6.2 Caching (ক্যাশিং) কী?
ক্যাশিং হলো এমন একটি টেকনিক যেখানে ফ্রিকোয়েন্টলি ব্যবহৃত (Frequently used) বা বারবার প্রয়োজন হয় এমন ডেটাকে অত্যন্ত দ্রুতগতি সম্পন্ন একটি অস্থায়ী স্টোরেজে (Temporary Storage) সেভ করে রাখা হয়।

**মূল থিওরি:**
- **ডাটাবেজ:** পার্মানেন্ট বা স্থায়ী, কিন্তু ডেটা পড়ে আনতে বেশ সময় লাগে (ধীরগতি)।
- **ক্যাশ:** টেম্পোরারি বা অস্থায়ী, কিন্তু এটি র‍্যাম (RAM) থেকে চলে বলে এর গতি অকল্পনীয় রকমের ফাস্ট (ন্যানোসেকেন্ড বা মিলি-সেকেন্ড)।

---

## 6.3 Real Production Story — Disaster without Cache (ক্যাশ ছাড়া প্রোডাকশন বিপর্যয়)
একটি ইআরপি (ERP) সিস্টেমে প্রতিদিন ৫০০০ কনকারেন্ট (Concurrent) ইউজার লগইন করতো।
সিস্টেমের ড্যাশবোর্ডে (Dashboard) বেশ কিছু ভারী SQL কুয়েরি ছিল, যেগুলো কোম্পানির সারা মাসের আয়-ব্যয় এবং স্টক রিপোর্ট দেখাতো।

**সমস্যা:**
প্রতিবার কোনো ইউজার ড্যাশবোর্ডে গেলেই সরাসরি ডাটাবেজে হিট হতো। 
একই রিপোর্ট বারবার ডাটাবেজ থেকে ক্যালকুলেট করার কারণে ডাটাবেজের CPU ৯৫%+ ব্যবহার হতে থাকে। ফলাফল হিসেবে পুরো সিস্টেম হ্যাং (hang) করে যায় এবং একটি পেজ লোড হতে ৮-১২ সেকেন্ড সময় নিতে থাকে।

**সমাধান (Solution):**
এখানে Redis Cache ইমপ্লিমেন্ট (Implement) করা হয়। ড্যাশবোর্ডের ডেটা একবার ডাটাবেজ থেকে ক্যালকুলেট করে Redis-এ ৫ মিনিটের জন্য (TTL) সেভ করে রাখা হয়। পরবর্তী ৫ মিনিটে যত ইউজার ড্যাশবোর্ডে আসে, সবাই সরাসরি Redis থেকে ডেটা দেখতে পায়, ডাটাবেজে কোনো হিট যায় না।
**ফলাফল:** ১২ সেকেন্ডের রেসপন্স টাইম কমে ২০০ মিলি-সেকেন্ডে নেমে আসে!

## 6.4 Cache Types (ক্যাশের প্রকারভেদ)

1. **In-Memory Cache (ইন-মেমোরি ক্যাশ):** 
   এটি অ্যাপ্লিকেশন সার্ভারের নিজস্ব র‍্যামের (RAM) মধ্যে থাকে। যেমন .NET এর MemoryCache বা Java এর HashMap। এটি সবচেয়ে ফাস্ট হলেও একটি বড় সমস্যা হলো—সার্ভার রিস্টার্ট দিলে সব ক্যাশ মুছে যায় এবং একাধিক সার্ভারের মধ্যে ক্যাশ শেয়ার করা যায় না।

2. **Distributed Cache (ডিস্ট্রিবিউটেড ক্যাশ - Redis):** 
   একাধিক সার্ভার মিলে একটি কমন (Common) ক্যাশ সার্ভার ব্যবহার করে। এটি স্কেলেবল সিস্টেমের জন্য সবচেয়ে জনপ্রিয়। **Redis (Remote Dictionary Server)** হলো পৃথিবীর সবচেয়ে ফাস্ট এবং বহুল ব্যবহৃত ডিস্ট্রিবিউটেড ক্যাশ।

3. **CDN Cache (সিডিএন ক্যাশ):** 
   যেকোনো স্ট্যাটিক ফাইল (Static Files) যেমন ইমেজ, ভিডিও, CSS বা JS ফাইলগুলো পৃথিবীর বিভিন্ন প্রান্তের সার্ভারে ক্যাশ করে রাখা হয়, যাতে ইউজার খুব দ্রুত তা ডাউনলোড করতে পারে।

```mermaid
graph TD
    User --> CDN[CDN - Edge Cache]
    CDN --> API[API Gateway / Load Balancer]
    API --> Redis[(Redis - Distributed Cache)]
    Redis -.-> DB[(Main SQL Database)]
```

## 6.5 Cache Patterns (ক্যাশিং প্যাটার্ন)
সিস্টেমে কীভাবে ক্যাশ ব্যবহার করা হবে তার বেশ কিছু প্যাটার্ন আছে।

### 1. Cache Aside (Lazy Loading) - সবচেয়ে বেশি ব্যবহৃত
**যেভাবে কাজ করে:**
- ইউজার API কল করলে সিস্টেম প্রথমে Redis (Cache) এ চেক করে।
- ডেটা পাওয়া গেলে (Cache Hit) সরাসরি ইউজারকে রিটার্ন করে।
- ডেটা না পাওয়া গেলে (Cache Miss) ডাটাবেজ থেকে ডেটা আনে, Redis এ সেভ করে এবং তারপর ইউজারকে দেয়।

### 2. Write Through Cache
এখানে কোনো নতুন ডেটা তৈরি বা আপডেট করার সময় একই সাথে ডাটাবেজ এবং ক্যাশ দুই জায়গাতেই আপডেট করা হয়। ফলে ডাটাবেজ এবং ক্যাশ সবসময় সিঙ্ক (Sync) থাকে।

---

## 6.6 Cache Invalidation Problem (ক্যাশ ইনভ্যালিডেশন)
কম্পিউটার সায়েন্সে একটি বিখ্যাত প্রবাদ আছে:
> "There are only two hard things in Computer Science: cache invalidation and naming things."

**ক্যাশ ইনভ্যালিডেশন কী?**
ধরুন, ইউজারের প্রোফাইল ডেটা Redis এ ক্যাশ করা আছে। ইউজার তার নাম পরিবর্তন করল (ডাটাবেজে আপডেট হলো)। কিন্তু ক্যাশ যদি আপডেট না হয়, তবে ইউজার তার আগের নামই দেখতে পাবে।
সঠিক সময়ে ক্যাশ মুছে ফেলা বা আপডেট করাকেই Cache Invalidation বলে।

**সমাধান (TTL - Time To Live):**
প্রতিটি ক্যাশ ডেটার একটি এক্সপায়ারি টাইম (Expiry time) বা TTL সেট করে দেওয়া হয়। যেমন ৫ মিনিট। ৫ মিনিট পর ক্যাশটি স্বয়ংক্রিয়ভাবে মুছে যাবে এবং ডাটাবেজ থেকে নতুন ডেটা এসে আবার সেভ হবে।

---

## 6.7 Cache Stampede Problem (ক্যাশ স্ট্যাম্পেড)
বড় সিস্টেমে এটি একটি ভয়াবহ সমস্যা।
ধরুন, ই-কমার্সের একটি জনপ্রিয় প্রোডাক্টের পেজ ক্যাশ করা আছে এবং এর TTL ৫ মিনিট।
৫ মিনিট পর ঠিক যখন ক্যাশটি এক্সপায়ার (Expire) হলো, ওই একই মুহূর্তে ২০ হাজার ইউজার প্রোডাক্ট পেজটিতে ভিজিট করল। যেহেতু ক্যাশ খালি, তাই ২০ হাজার রিকোয়েস্ট একই সাথে সরাসরি ডাটাবেজে হিট করবে এবং ডাটাবেজ সাথে সাথে ক্র্যাশ করবে!

**সমাধান:**
- **Cache Locking:** প্রথম রিকোয়েস্টটিকে ডাটাবেজে পাঠিয়ে বাকি রিকোয়েস্টগুলোকে কয়েক মিলি-সেকেন্ড অপেক্ষা করানো হয়।
- **Cache Pre-warming:** ক্যাশ এক্সপায়ার হওয়ার আগেই ব্যাকগ্রাউন্ড ওয়ার্কার দিয়ে নতুন ক্যাশ জেনারেট করে রাখা।

---

## 6.8 CDN (Content Delivery Network) - বিস্তারিত
CDN হলো গ্লোবাল এজ সার্ভারের (Global Edge Servers) একটি নেটওয়ার্ক। 
আপনার মেইন সার্ভার যদি আমেরিকায় থাকে, তবে বাংলাদেশ থেকে একজন ইউজারের একটি ইমেজ ডাউনলোড করতে অনেক সময় লাগবে (High Latency)।
CDN ব্যবহার করলে ওই ইমেজটি বাংলাদেশের কোনো লোকাল সার্ভারে (যেমন Cloudflare বা AWS CloudFront) ক্যাশ হয়ে থাকবে, ফলে ইউজার চোখের পলকে ইমেজটি দেখতে পাবে।

---

## 6.9 Chapter Summary (সারসংক্ষেপ)
এই চ্যাপ্টারে আমরা শিখলাম:
- **ক্যাশিং এর গুরুত্ব:** কীভাবে সিস্টেমকে বহুগুণ ফাস্ট করা যায়।
- **Redis ও Distributed Cache:** মাল্টিপল সার্ভারে কীভাবে ক্যাশ মেইনটেইন করতে হয়।
- **Cache Patterns (Cache Aside):** প্রোডাকশনে ক্যাশ ইমপ্লিমেন্ট করার সঠিক উপায়।
- **Cache Invalidation ও TTL:** পুরোনো ডেটা মুছে ফেলার কৌশল।
- **Cache Stampede:** ক্যাশ এক্সপায়ার হওয়ার পর ডাটাবেজ ক্র্যাশ ঠেকানোর পদ্ধতি।
- **CDN:** গ্লোবাল ইউজারদের জন্য স্ট্যাটিক অ্যাসেট দ্রুত ডেলিভারি দেওয়া।

### Rate Limiting Design
- User-based limits: user ID বা API token অনুযায়ী limit set করা
- IP-based limits: client IP থেকে burst traffic detect করা
- Global limits: distributed system এ shared counter use করা

### Distributed Rate Limiting
API Gateway বা service mesh এ global rate limiting implement করলে:
- centralized counter use করতে হবে (Redis, distributed cache)
- local limits + global sync করা যেতে পারে

### Consistent Hashing for Service Partitioning
Consistent hashing helps when data or sessions are partitioned across many nodes.
- Servers and keys are placed on a virtual ring
- A key maps to the next server clockwise
- Adding/removing nodes moves only a small subset of keys
- Virtual nodes balance load across uneven servers

Use case:
cache sharding, session affinity, distributed key-value stores

### CAP Theorem in Distributed Microservices
Distributed microservices face the CAP trade-off:
- Consistency: all nodes see the same data at the same time
- Availability: every request gets a response
- Partition tolerance: system survives network splits

In practice:
- choose CP for banking-style systems
- choose AP for high-traffic caches and notifications
- most real systems are AP or CP and accept eventual consistency

<div id="Chapter_15_Docker_and_Kubernetes" class="chapter-section">

# Chapter 15 — Docker & Kubernetes
Containerization & Orchestration
Practical System Design in Bangla

## 15.1 Introduction
Traditional software deployment এ সবচেয়ে বড় সমস্যা ছিল:
"It works on my machine, but not in production!"
Development PC তে code ঠিকভাবে চলে, কিন্তু server এ deploy করলে environment mismatch, missing library বা OS version এর কারণে crash করে।
এই সমস্যার সমাধান হলো **Containerization** (Docker) এবং **Orchestration** (Kubernetes)।

## 15.2 Docker কী?
Docker হলো একটি tool যা application এবং তার সমস্ত dependencies (libraries, runtime, OS components) কে একটি standard unit বা **Container** এ প্যাক করে।

```mermaid
graph TD
    subgraph Traditional VM
        A[Hardware] --> B[Host OS]
        B --> C[Hypervisor]
        C --> D[Guest OS 1]
        C --> E[Guest OS 2]
        D --> F[App A]
        E --> G[App B]
    end
    subgraph Docker Containers
        H[Hardware] --> I[Host OS]
        I --> J[Docker Engine]
        J --> K[App A]
        J --> L[App B]
    end
```

### কেন Docker?
- **Consistency:** Dev, Test এবং Production এ একই environment।
- **Lightweight:** VM এর মত পুরো OS রান করতে হয় না।
- **Fast Startup:** কয়েক সেকেন্ডে container চালু হয়।

## 15.3 Kubernetes (K8s) কী?
যখন production এ হাজার হাজার Docker container রান করে, তখন তাদের manage করার জন্য একটি system দরকার হয়। 
Kubernetes হলো একটি open-source container orchestration platform যা auto-scaling, load balancing এবং self-healing manage করে।

### Kubernetes Architecture

```mermaid
graph TD
    subgraph Control Plane (Master)
        A[API Server]
        B[Scheduler]
        C[Controller Manager]
        D[(etcd)]
    end
    
    subgraph Worker Node 1
        E[Kubelet]
        F[Kube-proxy]
        G[Pod 1]
        H[Pod 2]
    end
    
    subgraph Worker Node 2
        I[Kubelet]
        J[Kube-proxy]
        K[Pod 3]
    end
    
    A <--> E
    A <--> I
```

## 15.4 Core K8s Concepts
1. **Pod:** Kubernetes এর সবচেয়ে ছোট unit। একটি Pod এর ভেতর এক বা একাধিক container থাকতে পারে।
2. **Deployment:** Pod এর replica manage করে এবং rolling update নিশ্চিত করে।
3. **Service:** Pod গুলোর জন্য stable IP এবং Load Balancing provide করে।
4. **Ingress:** External traffic কে cluster এর ভেতরের Service এ route করে।

## 15.5 Real Production Story - Scaling with K8s
**Problem:** একটি e-commerce সাইটে campaign এর সময় হঠাৎ 10x traffic বেড়ে যায়। Server CPU 100% হয়ে crash করতো।
**Solution:** Kubernetes এর **HPA (Horizontal Pod Autoscaler)** ব্যবহার করে CPU usage 70% এর বেশি হলে স্বয়ংক্রিয়ভাবে নতুন Pod (container) তৈরি করার ব্যবস্থা করা হয়। Campaign শেষে traffic কমলে Pod গুলো নিজে থেকেই scale down হয়ে যায়।

# Chapter 16 — CI/CD Pipeline
Continuous Integration and Continuous Deployment
Practical System Design in Bangla

## 16.1 Introduction
আগেকার দিনে software deploy করা মানেই ছিল বিশাল ভয়ের ব্যাপার। Server down করতে হতো, ফাইল manually copy করতে হতো, এবং ভুল হলে আবার rollback করতে হতো।
আধুনিক System Design এ এই পুরো process টিকে automated করা হয় **CI/CD** এর মাধ্যমে।

## 16.2 CI/CD কী?
- **Continuous Integration (CI):** যখনই কোনো developer code push করে, সাথে সাথে স্বয়ংক্রিয়ভাবে build তৈরি হয় এবং automated testing (Unit/Integration Test) রান করে।
- **Continuous Deployment/Delivery (CD):** CI সফল হলে নতুন code স্বয়ংক্রিয়ভাবে Staging বা Production server এ deploy করা হয়।

## 16.3 CI/CD Pipeline Architecture

```mermaid
graph LR
    A[Developer Push Code] --> B[Git Repository]
    B --> C[CI Server<br/>GitHub Actions / Jenkins]
    C --> D{Run Tests}
    D -- Pass --> E[Build Docker Image]
    D -- Fail --> F[Alert Developer]
    E --> G[Push to Container Registry]
    G --> H[Update Kubernetes / Server]
    H --> I[Production Live]
```

## 16.4 Tools Used in CI/CD
1. **Source Control:** GitHub, GitLab, Bitbucket.
2. **CI Servers:** Jenkins, GitHub Actions, GitLab CI.
3. **Container Registry:** Docker Hub, AWS ECR.
4. **Deployment:** ArgoCD, Ansible, Terraform.

## 16.5 Deployment Strategies
Production এ downtime কমানোর জন্য বিভিন্ন deployment strategy ব্যবহার করা হয়:

### 1. Blue-Green Deployment
দুটি identical environment থাকে (Blue এবং Green)। একটিতে live traffic থাকে, অন্যটিতে নতুন version deploy করা হয়। সফল হলে traffic নতুনটিতে switch করা হয়।

### 2. Canary Release
নতুন version টি শুধুমাত্র ১০% user এর কাছে release করা হয়। যদি কোনো error না আসে, তাহলে ধীরে ধীরে ১০০% user এর জন্য release করা হয়।

## 16.6 Real Production Insight - Zero Downtime
**Problem:** একটি banking application এ update দিলে ১০ মিনিট downtime থাকতো।
**Solution:** CI/CD pipeline এবং Kubernetes এর মাধ্যমে **Rolling Update** implement করা হয়। এতে পুরনো Pod গুলো এক এক করে বন্ধ হয় এবং নতুন Pod চালু হয়, যার ফলে user কোনো downtime অনুভব করে না।

## 17.1 Introduction
ERP (Enterprise Resource Planning) System হলো এমন একটি software যা একটি বিশাল প্রতিষ্ঠানের Accounting, HR, Inventory, Production এবং CRM একসাথে manage করে।
ERP system design করা অত্যন্ত কঠিন কারণ এতে হাজার হাজার table, জটিল business logic এবং heavy reporting থাকে।

## 17.2 Core Challenges
- **Massive Database Scale:** লাখো transaction, inventory stock calculation।
- **Reporting Bottleneck:** Report generate করতে database overload হয়ে যায়।
- **Concurrency Control:** একই product একাধিক শাখা থেকে বিক্রি করার সময় deadlock হতে পারে।
- **Role-Based Access Control (RBAC):** কে কোন menu দেখতে পারবে তার strict permission।

## 17.3 High-Level ERP Architecture

```mermaid
graph TD
    User[Enterprise Users] --> LB(Load Balancer)
    LB --> API[API Gateway]
    
    API --> HR[HR Microservice]
    API --> Acc[Accounting Microservice]
    API --> Inv[Inventory Microservice]
    API --> Rep[Reporting Service]
    
    HR --> DB1[(HR DB)]
    Acc --> DB2[(Accounts DB)]
    Inv --> DB3[(Inventory DB)]
    
    Inv --> Kafka[Kafka / Message Queue]
    Kafka --> Rep
    Rep --> Redis[(Redis Cache)]
    Rep --> RepDB[(Reporting Database CQRS)]
```

## 17.4 Scaling Strategies for ERP
1. **CQRS Pattern:** Transaction এর জন্য একটি database (SQL Server) এবং Reporting এর জন্য আরেকটি database (PostgreSQL/MongoDB) ব্যবহার করা।
2. **Caching:** Dashboard এবং Permission tree Redis এ cache করে রাখা।
3. **Database Sharding:** Branch অনুযায়ী বা অর্থবছর (Fiscal Year) অনুযায়ী database partition করা।

## 17.5 Real Production Example
**Problem:** মাস শেষে (Month-end closing) একসাথে সব branch থেকে ledger report generate করার কারণে পুরো ERP system hang হয়ে যেত।
**Solution:** Async processing এবং Message Queue ব্যবহার করা হয়। User report request করলে তা RabbitMQ তে চলে যায়। Background worker report তৈরি করে Notification পাঠায়। ফলে API timeout বন্ধ হয়।

# Chapter 18 — Fintech System Design
Banking and Financial Software Architecture
Practical System Design in Bangla

## 18.1 Introduction
Fintech (Financial Technology) system ডিজাইন করা সাধারণ system ডিজাইন থেকে অনেক আলাদা। এখানে একটি ভুল মানে লক্ষ লক্ষ টাকার লোকসান।
Fintech system (যেমন Mobile Banking, Payment Gateway, Core Banking) এ Security এবং Consistency সবচেয়ে বেশি অগ্রাধিকার পায়।

## 18.2 Core Fintech Requirements
- **ACID Transactions:** Database এ transaction যেন কোনোভাবেই অর্ধেক সম্পন্ন না হয় (Atomicity)।
- **Idempotency:** একই payment request দুইবার hit করলেও যেন একবারই টাকা কাটে।
- **Security:** 2FA/MFA, Data Encryption at rest, JWT validation।
- **Audit Logs:** কে কখন কোন transaction করেছে তার Immutable log থাকতে হবে।

## 18.3 Fintech Architecture Diagram

```mermaid
graph TD
    Client[User App] --> WAF(Web Application Firewall)
    WAF --> Gateway[API Gateway]
    
    Gateway --> Auth[Auth Service]
    Gateway --> Txn[Transaction Service]
    Gateway --> Fraud[Fraud Detection Service]
    
    Txn --> DB[(Core SQL Database)]
    Txn --> Kafka[Kafka Events]
    
    Kafka --> Ledger[Ledger / Audit Service]
    Kafka --> Notification[SMS / Email Service]
    
    Fraud --> DB[(Machine Learning Models)]
```

## 18.4 Handling Idempotency
ধরি, user payment button এ দুইবার click করল অথবা network error এর কারণে retry হলো।
**Solution:** 
প্রতিটি request এ একটি Unique `Idempotency-Key` (UUID) পাঠাতে হবে।
API প্রথমে check করবে এই Key দিয়ে আগে transaction হয়েছে কিনা। হলে পুরোনো response টাই return করবে, নতুন করে টাকা কাটবে না।

## 18.5 Real Production Story - Deadlock in Banking
**Problem:** বেতন দেওয়ার দিন (Salary day) একই company account থেকে হাজার হাজার কর্মচারীর account এ টাকা ট্রান্সফার হওয়ার সময় SQL Server এ Deadlock হতো।
**Solution:** Transaction scope ছোট করা হয় এবং `Row-Level Lock` এর সিরিয়াল ঠিক করে দেওয়া হয়। এছাড়া Bulk transfer এর জন্য Message Queue ব্যবহার করে background এ process করা হয়।

# Chapter 19 — Facebook News Feed Case Study
Social Media Architecture and Scalability
Practical System Design in Bangla

## 19.1 Introduction
Facebook News Feed হলো পৃথিবীর সবচেয়ে heavily scaled system গুলোর মধ্যে অন্যতম। বিলিয়ন বিলিয়ন user যখন লগইন করে, তাদের বন্ধুদের পোস্ট, লাইক, ছবি ইত্যাদি একটি সাজানো ফিডে দেখাতে হয়, এবং সেটিও কয়েক মিলি-সেকেন্ডের মধ্যে।

## 19.2 High Level Architecture

```mermaid
graph TD
    User[User / Client] --> LB[Load Balancer]
    LB --> Web[Web Servers]
    
    Web --> Post[Post Service]
    Web --> Feed[Feed Generation Service]
    
    Post --> PostDB[(Post Database)]
    Post --> Kafka[Kafka Events]
    
    Kafka --> Fanout[Fanout Service]
    Fanout --> FeedCache[(News Feed Cache / Redis)]
    
    Feed --> FeedCache
```

## 19.3 The Fanout Concept
যখন কোনো বিখ্যাত ব্যক্তি (ধরি Cristiano Ronaldo) কোনো পোস্ট করে, তখন তার লক্ষ লক্ষ follower এর ফিডে সেই পোস্টটি পাঠাতে হয়।
এই প্রক্রিয়াকে বলা হয় **Fanout**।

### Fanout On Write (Push Model)
User যখন পোস্ট করে, সাথে সাথেই তার সব বন্ধুদের ফিড ক্যাশে (Cache) আপডেট করে দেওয়া হয়।
- **সুবিধা:** রিড (Read) অনেক ফাস্ট হয়।
- **সমস্যা:** অনেক বন্ধু থাকলে write করতে অনেক সময় লাগে।

### Fanout On Read (Pull Model)
User যখন ফিড স্ক্রল করে, তখন সার্ভার dynamically তার বন্ধুদের পোস্টগুলো ডাটাবেজ থেকে নিয়ে ফিড তৈরি করে।
- **সুবিধা:** Write ফাস্ট হয়।
- **সমস্যা:** Read slow হতে পারে।

**Facebook Hybrid Approach:** সাধারণ ইউজারদের জন্য Push Model ব্যবহার করা হয়, কিন্তু সেলিব্রিটিদের (যাদের ফলোয়ার অনেক) জন্য Pull Model ব্যবহার করা হয়।

## 19.4 Data Storage Strategy
- **User Data:** Relational Database (MySQL)
- **Post Data:** NoSQL (Cassandra / HBase)
- **Images/Videos:** CDN (Content Delivery Network) + Blob Storage
- **Feed Cache:** Redis / Memcached

## 19.5 Chapter Summary
News Feed ডিজাইনে সবচেয়ে বড় চ্যালেঞ্জ হলো data read speed। Fanout strategy এবং caching এর সঠিক ব্যবহারেই Facebook এত দ্রুত কাজ করে।

# Chapter 20 — WhatsApp Chat System Case Study
Real-time Messaging Architecture

## 20.1 Introduction
WhatsApp এর মত একটি মেসেজিং অ্যাপ্লিকেশনে বিলিয়ন বিলিয়ন মেসেজ প্রতিদিন আদান-প্রদান হয়। এই সিস্টেমের মূল চ্যালেঞ্জ হলো রিয়েল-টাইম (Real-time) ডেটা ডেলিভারি এবং এন্ড-টু-এন্ড এনক্রিপশন (End-to-End Encryption) নিশ্চিত করা।

    UserB[User B] -- WebSocket --> Gateway
    
    Gateway --> Session[Session Manager]
    Gateway --> MessageStore[(Message DB)]

## 20.3 Real-time Connection Management
HTTP request/response মডেল দিয়ে রিয়েল-টাইম চ্যাট তৈরি করা যায় না। এর জন্য প্রয়োজন **WebSocket**।
- ব্যবহারকারী অনলাইনে আসলে Chat Server এর সাথে একটি Persistent Connection (WebSocket) তৈরি হয়।
- সার্ভার সেই কানেকশনগুলো মেমোরিতে (বা Redis এ) সেভ করে রাখে।

## 20.4 Handling Offline Users
যদি User B অফলাইনে থাকে, তবে মেসেজটি সরাসরি ডেলিভারি করা সম্ভব নয়।
- মেসেজটি প্রথমে Database (যেমন Cassandra) এ সেভ করা হয়।
- User B অনলাইনে আসার সাথে সাথে Chat Server Database থেকে পেন্ডিং মেসেজগুলো টেনে এনে তাকে ডেলিভারি করে দেয় এবং ডাটাবেজ থেকে মুছে ফেলে।

## 20.5 Security (End-to-End Encryption)
WhatsApp এ সার্ভার নিজেও মেসেজ পড়তে পারে না।

- শুধুমাত্র User B তার Private Key দিয়ে সেটি ডিক্রিপ্ট করতে পারে।

# Chapter 22 — Large Scale ERP Architecture Case Study
Enterprise Application Architecture Breakdown
Practical System Design in Bangla

## 22.1 Introduction
বড় বড় মাল্টিন্যাশনাল কোম্পানিগুলোতে (যেমন Garments, Manufacturing) হাজার হাজার ইউজার একই সময়ে ERP (Enterprise Resource Planning) সিস্টেমে কাজ করে। এই ধরনের সিস্টেমে Data Consistency এবং Reporting অনেক বড় চ্যালেঞ্জ।

## 22.2 Multi-Tenant vs Single-Tenant
ERP সিস্টেমে সাধারণত **Multi-Tenant Architecture** ব্যবহার করা হয়।
- **Shared Database, Shared Schema:** সব কোম্পানির ডাটা এক ডাটাবেজে থাকে (TenantID দিয়ে আলাদা করা হয়)। 
- **Isolated Database:** বড় ক্লায়েন্টদের জন্য আলাদা আলাদা Database সার্ভার দেওয়া হয়।

## 22.3 High Level Architecture

```mermaid
graph TD
    User[Client Application] --> LB[Load Balancer]
    LB --> Gateway[API Gateway]
    
    Gateway --> HR[HR Module]
    Gateway --> Acc[Accounting Module]
    Gateway --> CRM[CRM Module]
    Gateway --> Inv[Inventory Module]
    
    HR --> DB1[(HR DB Cluster)]
    Acc --> DB2[(Accounts DB Cluster)]
    CRM --> DB3[(CRM DB Cluster)]
    Inv --> DB4[(Inventory DB Cluster)]
    
    Gateway --> Search[Elasticsearch - Fast Search]
    
    Inv --> Kafka[Kafka Queue]
    Acc --> Kafka
    
    Kafka --> ReportWorker[Reporting Worker Service]
    ReportWorker --> Redis[(Redis Cache)]
```

## 22.4 Solving the Reporting Bottleneck (CQRS)
ERP তে সবচেয়ে বড় সমস্যা হলো Report generate করা। 
- Transaction এর ডাটাবেজে (Write DB) Report এর query চললে পুরো সিস্টেম ধীর হয়ে যায়।
- তাই **CQRS (Command Query Responsibility Segregation)** ব্যবহার করা হয়।
- Write এর জন্য SQL Server/PostgreSQL এবং Read/Reporting এর জন্য আলাদা Replica Database বা Elasticsearch ব্যবহার করা হয়।

## 22.5 Caching and Audit Trail
- **Redis Cache:** Permission tree, Role-Based Access Control (RBAC) এবং ঘন ঘন ব্যবহার করা Dropdown data গুলো Redis এ ক্যাশ করা থাকে।
- **Audit Logs:** ERP তে "কে কখন কোন ডেটা পরিবর্তন করেছে" তা ট্রাক করার জন্য Event Sourcing বা Audit Log Table মেইনটেইন করা হয়, যা NoSQL (MongoDB) তে রাখা ভালো।
